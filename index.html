  details > summary::-webkit-details-marker { display: none; }

  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  @keyframes help-panel-slide-up   { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .help-backdrop-enter { animation: help-backdrop-fade 0.2s ease; }
  @media (min-width: 640px) {
    .help-panel-enter { animation: help-panel-slide-right 0.28s cubic-bezier(0.32,0.72,0,1); }
