<script type="text/babel" data-presets="env,react">
/* ==========================================================================
   HOUSEHOLD FINANCE APP
   Single-file React + Tailwind app. Organized by module (see banners below):
     1. Constants & helpers
     2. Database (in-memory store + IndexedDB persistence)
     3. Converter engine (CSV + PDF parse specs)
     4. Built-in converters
     5. Categorization rules
     6. Bootstrap helper (heuristic for new converters)
     7. App state (Context + reducer)
     8. UI primitives
     9. Layout components (Header, Nav)
    10. Upload feature (UploadView, DropZone, InstitutionPicker)
    11. Bootstrap wizard (new converter UI)
    12. Review feature (ReviewView, TransactionTable)
    13. Transactions feature (history view)
    14. Reports feature (charts)
    15. Converters feature (manage converters)
    16. App root + routing
   ========================================================================== */

const { useState, useEffect, useReducer, useContext, createContext, useMemo, useRef, useCallback } = React;

/* === MODULE 1: CONSTANTS & HELPERS ====================================== */

const CATEGORIES = [
  'Groceries','Dining','Transportation','Fuel','Shopping','Utilities','Rent/Mortgage',
  'Insurance','Healthcare','Fitness','Subscriptions','Entertainment','Travel','Education',
  'Childcare','Personal Care','Home','Gifts','Fees','Taxes','Income','Transfer',
  'Credit Card Payment','Refund','Other'
];

const TXN_TYPES = ['expense','income','transfer','refund','cc_payment'];
const TXN_TYPE_LABEL = {
  expense: 'Expense', income: 'Income', transfer: 'Transfer',
  refund: 'Refund', cc_payment: 'CC Payment'
};

const ACCOUNT_TYPES = ['chequing','savings','credit_card','line_of_credit','cash','other'];
const ACCOUNT_TYPE_LABEL = {
  chequing: 'Chequing', savings: 'Savings', credit_card: 'Credit Card',
  line_of_credit: 'Line of Credit', cash: 'Cash', other: 'Other'
};

// Common Canadian institutions (extensible)
const KNOWN_INSTITUTIONS = ['TD','RBC','Scotiabank','BMO','CIBC','Tangerine','Amex','PC Financial','Simplii','National Bank','Other'];

// --- Date helpers
const MONTH_ABBR = {
  JAN:'01', FEB:'02', MAR:'03', APR:'04', MAY:'05', JUN:'06',
  JUL:'07', AUG:'08', SEP:'09', OCT:'10', NOV:'11', DEC:'12'
};

function parseDate(input, format, yearHint) {
  // format: 'YYYY-MM-DD' | 'MM/DD/YYYY' | 'DD/MM/YYYY' | 'MM/DD' | 'DD/MM' | 'M/D/YYYY' | 'YYYY/MM/DD' | 'MMM DD' | 'auto'
  // yearHint is used when the format has no year token (e.g. 'MMM DD' or 'MM/DD').
  if (!input) return null;
  const s = String(input).trim();
  if (!s) return null;

  if (format === 'auto' || !format) {
    // Try ISO first, then common North American formats
    const isoMatch = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (isoMatch) return `${isoMatch[1]}-${isoMatch[2].padStart(2,'0')}-${isoMatch[3].padStart(2,'0')}`;
    const slash = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (slash) {
      // Default to MM/DD/YYYY (Canadian banks typically use this on statements)
      let [_, m, d, y] = slash;
      if (y.length === 2) y = '20' + y;
      return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
    }
    return null;
  }

  const tokens = format.match(/YYYY|YY|MMM|MM|M|DD|D/g);
  if (!tokens) return null;
  const sep = format.replace(/YYYY|YY|MMM|MM|M|DD|D/g,'').match(/[\/\-\.\s]/);
  const sepChar = sep ? sep[0] : '';
  // Always split on letter↔digit boundaries in addition to the format's separator,
  // so compact PDF text like "JAN30" (no whitespace between MMM and DD) parses the
  // same as "JAN 30" or "JAN-30". The TD Business statement prints dates this way.
  const splitRe = sepChar
    ? new RegExp(`[\\${sepChar}]|(?<=[A-Za-z])(?=\\d)|(?<=\\d)(?=[A-Za-z])`)
    : /(?<=[A-Za-z])(?=\d)|(?<=\d)(?=[A-Za-z])/;
  const parts = s.split(splitRe).filter(Boolean);
  let y, m, d;
  tokens.forEach((tok, i) => {
    const v = parts[i];
    if (!v) return;
    if (tok === 'YYYY') y = v;
    else if (tok === 'YY') y = '20' + v;
    else if (tok === 'MMM') {
      m = MONTH_ABBR[v.toUpperCase().slice(0,3)] || null;
    }
    else if (tok === 'MM' || tok === 'M') m = v.padStart(2,'0');
    else if (tok === 'DD' || tok === 'D') d = v.padStart(2,'0');
  });
  if (!m || !d) return null;
  if (!y) y = yearHint ? String(yearHint) : String(new Date().getFullYear());
  // Validate ranges
  const mi = parseInt(m, 10), di = parseInt(d, 10);
  if (mi < 1 || mi > 12 || di < 1 || di > 31) return null;
  return `${y}-${m}-${d}`;
}

function formatDateDisplay(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${y}-${m}-${d}`;
}

function monthKey(iso) { return iso ? iso.slice(0,7) : ''; }
function monthLabel(key) {
  if (!key) return '';
  const [y,m] = key.split('-');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${names[parseInt(m,10)-1]} ${y}`;
}

// --- Amount helpers
function parseAmount(v) {
  if (v === null || v === undefined || v === '') return null;
  const s = String(v).replace(/[\s$,]/g,'').replace(/[()]/g,m => m === '(' ? '-' : '');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function formatMoney(n, currency='CAD') {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}

// Recover the signed direction of a stored transaction. Older DB rows persist
// `amount` only (always positive) and rely on `transaction_type` to imply sign,
// so reports need a way to recover the signed value. For `transfer` — the only
// type where the type alone is ambiguous — the description's TFR-TO / TFR-FROM
// pattern tells us; default to outflow when nothing else hints. New rows persist
// signed_amount directly via insertTransaction, so this only fires for legacy
// data once.
function deriveSignedAmount(t) {
  if (typeof t.signed_amount === 'number') return t.signed_amount;
  const amt = Math.abs(t.amount || 0);
  const type = t.transaction_type;
  if (type === 'expense') return -amt;
  if (type === 'income' || type === 'refund' || type === 'cc_payment') return amt;
  if (type === 'transfer') {
    const d = (t.description || '').toLowerCase();
    if (/tfr-from|transfer from|^from\s/.test(d)) return amt;
    return -amt; // TFR-TO or unknown — default outflow
  }
  return -amt;
}

// --- Fingerprint (for dedup)
async function fingerprint(parts) {
  const text = parts.filter(p => p !== null && p !== undefined).map(p => String(p).trim().toLowerCase()).join('|');
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).slice(0,12).map(b => b.toString(16).padStart(2,'0')).join('');
}

// --- Misc
function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function classNames(...xs) { return xs.filter(Boolean).join(' '); }
function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }
function downloadBlob(data, filename, mime='application/octet-stream') {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* === MODULE 1.5: LLM PROVIDER ADAPTER ===================================
   Optional AI-assisted converter authoring. The model's ONLY job is to emit
   a converter spec JSON (the same shape Module 3 consumes) — it never sees or
   touches the user's transaction data, so any structured-output-capable model
   works. Two providers are supported, both called browser-direct with the
   user's own key (stored in localStorage, never in the app state blob):

     - Anthropic: forces structured output via tool use
     - OpenAI:    forces structured output via response_format json_schema

   `callLLM()` normalizes both to { spec, text } where `spec` is the parsed
   converter spec object and `text` is the model's short explanation.
   ========================================================================== */

const LLM_KEY_STORAGE = {
  provider: 'loonieledger_llm_provider',
  anthropic: 'loonieledger_llm_key_anthropic',
  openai: 'loonieledger_llm_key_openai',
};

// Top-tier default per provider — spec quality is the whole point, so we don't
// economize here. Overridable, but these are what the wizard uses by default.
const LLM_PROVIDERS = {
  anthropic: { label: 'Anthropic (Claude)', defaultModel: 'claude-sonnet-4-6', keyUrl: 'https://console.anthropic.com/settings/keys' },
  openai:    { label: 'OpenAI (GPT)',       defaultModel: 'gpt-4o',            keyUrl: 'https://platform.openai.com/api-keys' },
};

function getLLMConfig() {
  const provider = localStorage.getItem(LLM_KEY_STORAGE.provider) || 'anthropic';
  const apiKey = localStorage.getItem(LLM_KEY_STORAGE[provider]) || '';
  return { provider, apiKey, model: LLM_PROVIDERS[provider]?.defaultModel };
}
function setLLMConfig({ provider, apiKey }) {
  if (provider) localStorage.setItem(LLM_KEY_STORAGE.provider, provider);
  if (provider && typeof apiKey === 'string') localStorage.setItem(LLM_KEY_STORAGE[provider], apiKey.trim());
}

// JSON Schema describing a converter spec. Shared by both providers as the
// structured-output contract. Intentionally permissive (the engine tolerates
// extra/missing optional fields); the goal is to force valid JSON, not to
// over-constrain the model.
const SPEC_JSON_SCHEMA = {
  type: 'object',
  properties: {
    spec: {
      type: 'object',
      description: 'The converter spec object that Module 3 (applyConverter) consumes.',
      properties: {
        type: { type: 'string', enum: ['csv', 'pdf'] },
        // CSV
        has_header: { type: 'boolean' },
        delimiter: { type: 'string' },
        skip_top_rows: { type: 'integer' },
        skip_bottom_rows: { type: 'integer' },
        columns: { type: 'object', description: 'CSV: field->header-name/index. Columns-mode PDF: array handled separately.', additionalProperties: true },
        // PDF (line-regex)
        line_regex: { type: 'string' },
        groups: { type: 'object', additionalProperties: { type: 'integer' } },
        next_line_amount_regex: { type: 'string' },
        next_line_amount_lookahead: { type: 'integer' },
        // PDF (columns layout)
        layout: { type: 'string', enum: ['columns'] },
        pdf_columns: {
          type: 'array',
          description: 'For layout:"columns" — written to spec.columns. Each entry {name,x_min,x_max}.',
          items: { type: 'object', properties: { name: { type: 'string' }, x_min: { type: 'number' }, x_max: { type: 'number' } }, required: ['name', 'x_min', 'x_max'] },
        },
        account_section_regex: { type: 'string' },
        account_section_end_regex: { type: 'string' },
        merge_continuation_rows: { type: 'boolean' },
        description_strip_regex: { type: 'string' },
        description_strip_regex_flags: { type: 'string' },
        // period / year
        period_regex: { type: 'string' },
        period_groups: { type: 'object', additionalProperties: { type: 'integer' } },
        year: { type: 'integer' },
        // shared
        date_format: { type: 'string', description: "e.g. YYYY-MM-DD, MM/DD/YYYY, 'MMM DD', MMMDD, auto" },
        amount_handling: { type: 'string', enum: ['single_signed', 'split_debit_credit'] },
        amount_sign: { type: 'string', enum: ['natural', 'flipped'] },
        totals: {
          type: 'array',
          items: { type: 'object', properties: { regex: { type: 'string' }, match: { type: 'string', enum: ['all', 'positive', 'negative'] }, label: { type: 'string' } }, required: ['regex', 'match'] },
        },
        account_type: { type: 'string' },
        default_account: { type: 'string' },
        default_currency: { type: 'string' },
      },
      required: ['type', 'date_format', 'amount_handling', 'amount_sign', 'account_type'],
      additionalProperties: true,
    },
    explanation: { type: 'string', description: 'One or two sentences: what you detected, or what you changed.' },
  },
  required: ['spec', 'explanation'],
};

// System prompt: the spec-format reference. Abbreviated from CLAUDE.md so the
// model knows the exact field semantics the deterministic engine expects.
const LLM_SYSTEM_PROMPT = `You are an expert at reverse-engineering bank/credit-card statement formats into a deterministic parser spec. You are given an excerpt of ONE statement (CSV text, or PDF text, and for tabular PDFs a sample of items with their x-coordinates). Produce a converter spec JSON that will correctly extract every transaction. The spec is consumed by a deterministic engine — you must get regexes, column names, date formats and signs exactly right.

SIGN CONVENTION: after normalization, amount < 0 = money out (expense), amount > 0 = money in. amount_sign "natural" keeps the raw sign; "flipped" negates it (use for credit-card statements where charges print as positive). amount_handling is "single_signed" (one amount column/group) or "split_debit_credit" (separate debit & credit columns).

DATE FORMATS: tokens YYYY/YY/MMM/MM/M/DD/D. "MMM" = 3-letter month (JAN..DEC); full month names are sliced to 3 letters. Compact forms like "MMMDD" (JAN30, no separator) are supported. Use "auto" only as a last resort.

CSV spec: { type:"csv", has_header, delimiter, skip_top_rows?, columns:{transaction_date, description, amount | debit+credit, posted_date?}, date_format, amount_handling, amount_sign, account_type, default_account, default_currency }. Column values are header names (when has_header) or 0-based indices.

PDF line-regex spec: { type:"pdf", line_regex (matches ONE transaction line), groups:{transaction_date, posted_date?, description, amount}, date_format, amount_handling, amount_sign, ... }. Capture-group indices are 1-based. When the signed amount sits on the NEXT line (e.g. Amex), set next_line_amount_regex and point groups.amount at it. PDF lines often carry only "MMM DD" with no year — supply period_regex + period_groups (capturing start_month/start_year?/end_month/end_year) so the engine recovers the year from the statement header; start_year may be omitted. As a fallback set "year".

PDF columns-layout spec (use when debit vs credit depends on x-position, not text): { type:"pdf", layout:"columns", pdf_columns:[{name,x_min,x_max}], ... }. Standard names: description, debit, credit, date, balance (or amount for single_signed). Derive x ranges from the provided x-coordinate sample. Optional: account_section_regex + account_section_end_regex (scope to one account in a multi-account file), merge_continuation_rows (fold undated wrap rows into the prior description), description_strip_regex (+_flags) to strip boilerplate prefixes.

OPTIONAL totals sanity-check: totals:[{regex (group1 = a printed dollar total), match:"all"|"positive"|"negative", label}].

Return ONLY the structured spec + a one or two sentence explanation. If given a current spec and parse errors, return a corrected spec and say what you changed.`;

// Build a converter-spec request and return { spec, text }. Throws on HTTP/parse error.
async function callLLM({ provider, apiKey, model, messages, signal }) {
  if (!apiKey) throw new Error('No API key set for ' + provider);
  if (provider === 'anthropic') return callAnthropic({ apiKey, model, messages, signal });
  if (provider === 'openai') return callOpenAI({ apiKey, model, messages, signal });
  throw new Error('Unknown provider: ' + provider);
}

async function callAnthropic({ apiKey, model, messages, signal }) {
  const tool = {
    name: 'emit_converter_spec',
    description: 'Emit the converter spec JSON and a short explanation.',
    input_schema: SPEC_JSON_SCHEMA,
  };
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    signal,
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: model || LLM_PROVIDERS.anthropic.defaultModel,
      max_tokens: 2048,
      system: LLM_SYSTEM_PROMPT,
      tools: [tool],
      tool_choice: { type: 'tool', name: 'emit_converter_spec' },
      messages,
    }),
  });
  if (!res.ok) throw new Error(await llmErrorText(res));
  const data = await res.json();
  const block = (data.content || []).find(b => b.type === 'tool_use');
  if (!block) throw new Error('Model did not return a spec.');
  return { spec: block.input.spec, text: block.input.explanation || '' };
}

async function callOpenAI({ apiKey, model, messages, signal }) {
  // OpenAI structured outputs require strict schemas; wrap ours.
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    signal,
    headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({
      model: model || LLM_PROVIDERS.openai.defaultModel,
      messages: [{ role: 'system', content: LLM_SYSTEM_PROMPT }, ...messages],
      response_format: {
        type: 'json_schema',
        json_schema: { name: 'converter_spec', schema: SPEC_JSON_SCHEMA },
      },
    }),
  });
  if (!res.ok) throw new Error(await llmErrorText(res));
  const data = await res.json();
  const content = data.choices?.[0]?.message?.content;
  if (!content) throw new Error('Model returned no content.');
  const parsed = JSON.parse(content);
  return { spec: parsed.spec, text: parsed.explanation || '' };
}

async function llmErrorText(res) {
  let detail = '';
  try { const j = await res.json(); detail = j.error?.message || JSON.stringify(j.error || j); }
  catch { detail = await res.text().catch(() => ''); }
  if (res.status === 401) return 'Invalid or missing API key (401). Check your key.';
  if (res.status === 429) return 'Rate limited (429). Wait a moment and retry.';
  return `Request failed (${res.status}). ${detail}`.trim();
}

// Normalize the wizard's spec shape into what the engine expects: columns-mode
// PDFs carry their column ranges under pdf_columns in the schema, but the
// engine reads spec.columns. Fold that here so LivePreview/applyConverter work.
function normalizeWizardSpec(spec) {
  if (!spec) return spec;
  const out = { ...spec };
  if (out.layout === 'columns' && Array.isArray(out.pdf_columns)) {
    out.columns = out.pdf_columns;
    delete out.pdf_columns;
  }
  return out;
}

/* === MODULE 2: DATABASE LAYER ===========================================
   Pure JS in-memory store + IndexedDB persistence. No WASM, works in
   any sandboxed iframe. Schema:
     accounts:        { id, institution, account_name, account_type, currency }
     converters:      { id, key, name, institution, account_type, format, spec_json, is_builtin, notes, created_at }
     documents:       { id, filename, format, institution, account_id, converter_id, status, raw_size, notes, uploaded_at }
     transactions:    { id, document_id, account_id, transaction_date, posted_date, description, merchant, amount, currency, category, transaction_type, is_excluded, fingerprint, created_at }
     category_rules:  { id, pattern, match_type, category, priority }
   Uniqueness invariants enforced in JS:
     - accounts: (institution, account_name)
     - converters: (key)
     - transactions: (account_id, fingerprint)  ← duplicate detection
   ========================================================================== */

const DB_NAME = 'household_finance_db';
const DB_STORE = 'kv';
const DB_KEY = 'state_v1';

// --- Persistence layer: tries IndexedDB → localStorage → in-memory only.
// `STORAGE_MODE` is set during init and exposed for the UI banner.
let STORAGE_MODE = 'memory'; // 'idb' | 'localstorage' | 'memory'
let MEMORY_FALLBACK = {};

function tryIdbOpen() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') return reject(new Error('IndexedDB not available'));
    let req;
    try { req = indexedDB.open(DB_NAME, 1); }
    catch (e) { return reject(e); }
    req.onupgradeneeded = () => {
      try { req.result.createObjectStore(DB_STORE); } catch (e) {}
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
}

async function detectStorageMode() {
  // Try IDB first
  try {
    const db = await tryIdbOpen();
    db.close();
    STORAGE_MODE = 'idb';
    return;
  } catch (e) { /* fall through */ }

  // Try localStorage
  try {
    const k = '__test_' + Math.random();
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    STORAGE_MODE = 'localstorage';
    return;
  } catch (e) { /* fall through */ }

  STORAGE_MODE = 'memory';
}

async function idbGet(key) {
  if (STORAGE_MODE === 'memory') return MEMORY_FALLBACK[key] ?? null;
  if (STORAGE_MODE === 'localstorage') {
    const raw = localStorage.getItem(DB_NAME + ':' + key);
    return raw ? JSON.parse(raw) : null;
  }
  const db = await tryIdbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value) {
  if (STORAGE_MODE === 'memory') { MEMORY_FALLBACK[key] = value; return; }
  if (STORAGE_MODE === 'localstorage') {
    try { localStorage.setItem(DB_NAME + ':' + key, JSON.stringify(value)); }
    catch (e) {
      // Hit quota — degrade to memory
      STORAGE_MODE = 'memory';
      MEMORY_FALLBACK[key] = value;
    }
    return;
  }
  const db = await tryIdbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbDelete(key) {
  if (STORAGE_MODE === 'memory') { delete MEMORY_FALLBACK[key]; return; }
  if (STORAGE_MODE === 'localstorage') { localStorage.removeItem(DB_NAME + ':' + key); return; }
  const db = await tryIdbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// --- In-memory store + dao
const blankStore = () => ({
  accounts: [], converters: [], documents: [], transactions: [], category_rules: [],
  next_id: { accounts: 1, converters: 1, documents: 1, transactions: 1, category_rules: 1 }
});
let STORE = blankStore();

async function initDB() {
  await detectStorageMode();
  try {
    const saved = await idbGet(DB_KEY);
    if (saved && typeof saved === 'object') {
      STORE = { ...blankStore(), ...saved, next_id: { ...blankStore().next_id, ...(saved.next_id || {}) } };
    }
  } catch (e) {
    console.warn('Failed to load saved store, starting fresh:', e);
  }
  return STORE;
}

const persistDB = debounce(async () => {
  try { await idbSet(DB_KEY, STORE); } catch (e) { console.warn('persist failed:', e); }
}, 200);
const persistNow = async () => {
  try { await idbSet(DB_KEY, STORE); } catch (e) { console.warn('persist failed:', e); }
};

const nextId = (table) => STORE.next_id[table]++;
const findById = (table, id) => STORE[table].find(r => r.id === Number(id));

const dao = {
  // Accounts
  listAccounts: () => [...STORE.accounts].sort((a,b) =>
    (a.institution || '').localeCompare(b.institution || '') ||
    (a.account_name || '').localeCompare(b.account_name || '')),
  upsertAccount: ({ institution, account_name, account_type, currency='CAD' }) => {
    const existing = STORE.accounts.find(a => a.institution === institution && a.account_name === account_name);
    if (existing) return existing.id;
    const id = nextId('accounts');
    STORE.accounts.push({ id, institution, account_name, account_type: account_type || null, currency });
    persistDB();
    return id;
  },

  // Converters
  listConverters: () => [...STORE.converters].sort((a,b) =>
    (a.institution || '').localeCompare(b.institution || '') ||
    (a.name || '').localeCompare(b.name || '')),
  getConverter: id => findById('converters', id),
  getConverterByKey: key => STORE.converters.find(c => c.key === key),
  findConverters: ({ institution, format, account_type }) => {
    return STORE.converters.filter(c =>
      (!institution || c.institution === institution) &&
      (!format || c.format === format) &&
      (!account_type || c.account_type === account_type || c.account_type == null)
    );
  },
  saveConverter: ({ id, key, name, institution, account_type, format, spec_json, notes, is_builtin = 0 }) => {
    if (id) {
      const c = findById('converters', id);
      if (c) Object.assign(c, { name, institution, account_type: account_type || null, format, spec_json, notes: notes || null });
      persistDB();
      return id;
    }
    const newId = nextId('converters');
    STORE.converters.push({
      id: newId, key, name, institution,
      account_type: account_type || null, format, spec_json,
      is_builtin, notes: notes || null,
      created_at: new Date().toISOString()
    });
    persistDB();
    return newId;
  },
  deleteConverter: id => {
    STORE.converters = STORE.converters.filter(c => c.id !== Number(id));
    persistDB();
  },

  // Documents
  insertDocument: (doc) => {
    const id = nextId('documents');
    STORE.documents.push({
      id,
      filename: doc.filename, format: doc.format,
      institution: doc.institution || null, account_id: doc.account_id || null,
      converter_id: doc.converter_id || null, status: doc.status || 'uploaded',
      raw_size: doc.raw_size || null, notes: doc.notes || null,
      uploaded_at: new Date().toISOString()
    });
    persistDB();
    return id;
  },
  updateDocumentStatus: (id, status) => {
    const d = findById('documents', id);
    if (d) { d.status = status; persistDB(); }
  },
  listDocuments: () => {
    return [...STORE.documents]
      .map(d => ({
        ...d,
        account_name: findById('accounts', d.account_id)?.account_name || null,
        converter_name: findById('converters', d.converter_id)?.name || null
      }))
      .sort((a, b) => (b.uploaded_at || '').localeCompare(a.uploaded_at || ''));
  },
  getDocument: id => {
    const d = findById('documents', id);
    if (!d) return null;
    return {
      ...d,
      account_name: findById('accounts', d.account_id)?.account_name || null,
      converter_name: findById('converters', d.converter_id)?.name || null
    };
  },
  countTransactionsForDocument: id => {
    const did = Number(id);
    return STORE.transactions.filter(t => t.document_id === did).length;
  },
  deleteDocument: id => {
    const did = Number(id);
    STORE.transactions = STORE.transactions.filter(t => t.document_id !== did);
    STORE.documents = STORE.documents.filter(d => d.id !== did);
    persistDB();
  },

  // Transactions
  insertTransaction: tx => {
    if (STORE.transactions.find(t => t.account_id === tx.account_id && t.fingerprint === tx.fingerprint)) {
      return null; // duplicate
    }
    const id = nextId('transactions');
    // Persist signed_amount alongside amount so Reports can detect direction
    // without re-deriving from type each query. If the caller didn't supply one
    // (older code paths), fall back to deriveSignedAmount.
    const signed = typeof tx.signed_amount === 'number'
      ? tx.signed_amount
      : deriveSignedAmount(tx);
    STORE.transactions.push({
      id,
      document_id: tx.document_id || null, account_id: tx.account_id || null,
      transaction_date: tx.transaction_date, posted_date: tx.posted_date || null,
      description: tx.description, merchant: tx.merchant || null,
      amount: tx.amount, signed_amount: signed, currency: tx.currency || 'CAD',
      category: tx.category || null, transaction_type: tx.transaction_type || 'expense',
      is_excluded: tx.is_excluded ? 1 : 0, fingerprint: tx.fingerprint,
      created_at: new Date().toISOString()
    });
    return id;
  },
  isDuplicate: (account_id, fp) => {
    return STORE.transactions.some(t => t.account_id === account_id && t.fingerprint === fp);
  },
  listTransactions: (filters = {}) => {
    const aid = filters.account_id ? Number(filters.account_id) : null;
    const search = filters.search ? filters.search.toLowerCase() : null;
    const accountMap = new Map(STORE.accounts.map(a => [a.id, a]));
    const rows = STORE.transactions.filter(t => {
      if (filters.from && t.transaction_date < filters.from) return false;
      if (filters.to && t.transaction_date > filters.to) return false;
      if (aid && t.account_id !== aid) return false;
      if (filters.category && t.category !== filters.category) return false;
      if (search) {
        const d = (t.description || '').toLowerCase(), m = (t.merchant || '').toLowerCase();
        if (!d.includes(search) && !m.includes(search)) return false;
      }
      return true;
    }).map(t => {
      const a = accountMap.get(t.account_id);
      // Backfill signed_amount for rows written before it was persisted.
      const signed = typeof t.signed_amount === 'number' ? t.signed_amount : deriveSignedAmount(t);
      return { ...t, signed_amount: signed, account_name: a?.account_name || null, institution: a?.institution || null, account_type: a?.account_type || null };
    });
    rows.sort((a, b) =>
      (b.transaction_date || '').localeCompare(a.transaction_date || '') ||
      b.id - a.id);
    return rows;
  },
  countUncategorized: () =>
    STORE.transactions.filter(t => !t.category || t.category === 'Other').length,
  updateTransaction: (id, fields) => {
    const t = findById('transactions', id);
    if (t) { Object.assign(t, fields); persistDB(); }
  },
  deleteTransaction: id => {
    STORE.transactions = STORE.transactions.filter(t => t.id !== Number(id));
    persistDB();
  },
  bulkInsertTransactions: txs => {
    let inserted = 0, skipped = 0;
    for (const t of txs) {
      if (dao.insertTransaction(t)) inserted++; else skipped++;
    }
    persistDB();
    return { inserted, skipped };
  },

  // Category rules
  listCategoryRules: () => [...STORE.category_rules].sort((a, b) =>
    (b.priority || 0) - (a.priority || 0) || a.id - b.id),
  saveCategoryRule: ({ id, pattern, match_type = 'contains', category, priority = 100 }) => {
    if (id) {
      const r = findById('category_rules', id);
      if (r) Object.assign(r, { pattern, match_type, category, priority });
    } else {
      const newId = nextId('category_rules');
      STORE.category_rules.push({ id: newId, pattern, match_type, category, priority });
    }
    persistDB();
  },
  deleteCategoryRule: id => {
    STORE.category_rules = STORE.category_rules.filter(r => r.id !== Number(id));
    persistDB();
  },

  // Maintenance
  resetAll: async () => {
    STORE = blankStore();
    await persistNow();
  },
  exportDB: () => {
    const json = JSON.stringify(STORE, null, 2);
    return new TextEncoder().encode(json);
  },
  importDB: async (uint8) => {
    const text = new TextDecoder().decode(uint8);
    const parsed = JSON.parse(text);
    STORE = { ...blankStore(), ...parsed, next_id: { ...blankStore().next_id, ...(parsed.next_id || {}) } };
    await persistNow();
  }
};

/* === MODULE 3: CONVERTER ENGINE =========================================
   A "converter" is a JSON spec describing how to deterministically transform
   one institution's document format into normalized transactions. No LLM
   involvement at parse time. The engine here interprets two spec types:
     * type: 'csv'  — column-mapping CSV parser
     * type: 'pdf'  — regex-line PDF parser
   Specs are stored in the DB; parse() takes the raw text and a spec and
   returns Transaction[].
   ========================================================================== */

// Detect format from filename + magic bytes
function detectFormat(filename, sample) {
  const f = (filename || '').toLowerCase();
  if (f.endsWith('.csv') || f.endsWith('.tsv')) return 'csv';
  if (f.endsWith('.pdf')) return 'pdf';
  if (f.endsWith('.qfx') || f.endsWith('.ofx')) return 'ofx';
  // Magic bytes: PDF starts with %PDF
  if (sample && sample.slice(0,4) === '%PDF') return 'pdf';
  if (sample && /[\,\;\t]/.test(sample.slice(0,200))) return 'csv';
  return 'unknown';
}

// Read a File into the right form for parsing
async function readFileForParse(file, format) {
  if (format === 'pdf') {
    const buf = await file.arrayBuffer();
    return { kind: 'pdf', data: new Uint8Array(buf) };
  }
  // CSV: try utf-8, fall back to latin1
  const text = await file.text();
  return { kind: 'text', data: text };
}

// Extract plain text from a PDF (per page, joined with newlines)
async function pdfToText(uint8) {
  const loadingTask = pdfjsLib.getDocument({ data: uint8 });
  const pdf = await loadingTask.promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // Build lines by Y coordinate clustering
    const items = content.items.map(it => ({
      str: it.str,
      x: it.transform[4],
      y: Math.round(it.transform[5])
    }));
    const lines = {};
    items.forEach(it => {
      const key = it.y;
      if (!lines[key]) lines[key] = [];
      lines[key].push(it);
    });
    const sortedKeys = Object.keys(lines).map(Number).sort((a,b) => b - a);
    const pageLines = sortedKeys.map(k =>
      lines[k].sort((a,b) => a.x - b.x).map(it => it.str).join(' ').replace(/\s+/g,' ').trim()
    ).filter(Boolean);
    pages.push(pageLines.join('\n'));
  }
  return pages.join('\n\n');
}

// Like pdfToText, but preserves x-coord per item so column-aware specs can bucket
// each row's items into named fields. Used by `layout: 'columns'` PDF converters
// (e.g. TD Business chequing) where debit vs credit is determined by which column
// the amount sits in — information that's lost as soon as items get joined to text.
async function pdfToRows(uint8) {
  const loadingTask = pdfjsLib.getDocument({ data: uint8 });
  const pdf = await loadingTask.promise;
  const allRows = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const items = content.items.map(it => ({
      str: it.str,
      x: it.transform[4],
      y: Math.round(it.transform[5])
    }));
    const byY = {};
    items.forEach(it => {
      if (!byY[it.y]) byY[it.y] = [];
      byY[it.y].push(it);
    });
    Object.keys(byY).map(Number).sort((a,b) => b - a).forEach(y => {
      allRows.push({ y, page: i, items: byY[y].sort((a,b) => a.x - b.x) });
    });
  }
  return allRows;
}

// Bucket a row's items into named fields by x-coord range. Each `columns` entry
// is `{ name, x_min, x_max }`; the items whose x falls in [x_min, x_max) get joined
// with single spaces. Missing columns produce an empty string for that field.
function bucketByColumns(items, columns) {
  const out = {};
  for (const col of columns) {
    const cells = items.filter(it => it.x >= col.x_min && it.x < col.x_max);
    out[col.name] = cells.map(c => c.str).join(' ').replace(/\s+/g, ' ').trim();
  }
  return out;
}

// Apply a CSV spec to text → raw rows
function parseCSVText(text, spec) {
  const parsed = Papa.parse(text.replace(/^﻿/, ''), {
    delimiter: spec.delimiter || '',
    skipEmptyLines: true,
  });
  let rows = parsed.data;
  if (spec.skip_top_rows) rows = rows.slice(spec.skip_top_rows);
  if (spec.skip_bottom_rows) rows = rows.slice(0, rows.length - spec.skip_bottom_rows);

  let headers = null;
  if (spec.has_header) {
    headers = rows[0].map(h => String(h || '').trim());
    rows = rows.slice(1);
  }
  return { headers, rows };
}

// Convert column reference (header name OR numeric index) → numeric index
function colIndex(ref, headers) {
  if (ref === null || ref === undefined || ref === '') return -1;
  if (typeof ref === 'number') return ref;
  if (headers) {
    const idx = headers.findIndex(h => h.toLowerCase() === String(ref).toLowerCase());
    if (idx >= 0) return idx;
  }
  // try to parse as number
  const n = parseInt(ref, 10);
  return isNaN(n) ? -1 : n;
}

function getCell(row, ref, headers) {
  const i = colIndex(ref, headers);
  return i >= 0 && i < row.length ? row[i] : null;
}

// Determine transaction_type from amount sign + account_type
function inferTxnType(signedAmount, accountType, description='') {
  const desc = (description || '').toLowerCase();
  if (/payment.*received|cc payment|payment - thank you|payment thank you|paiement/i.test(desc)) {
    return accountType === 'credit_card' ? 'cc_payment' : 'transfer';
  }
  if (/(transfer|tfr|e-transfer|virement|^to\s|^from\s)/i.test(desc)) return 'transfer';
  if (/(refund|remboursement|return)/i.test(desc) && signedAmount > 0) return 'refund';

  // Convention after normalization: signed < 0 = money out, signed > 0 = money in.
  if (accountType === 'credit_card') {
    if (signedAmount < 0) return 'expense';                // a charge
    return /payment/i.test(desc) ? 'cc_payment' : 'refund'; // money in: payment/refund
  } else {
    return signedAmount < 0 ? 'expense' : 'income';        // chequing/savings
  }
}

// Build a month-number → year resolver for PDF statements that span a year
// boundary (e.g. Dec 2024 → Jan 2025). Looks for spec.period_regex in the
// statement text and uses spec.period_groups to find start/end month + year.
// Returns a fn (dateStr) → year that falls back to fallbackYear when no
// period info is available or the month can't be matched.
function buildYearResolver(fullText, spec, fallbackYear) {
  let map = null;
  let matched = false;
  if (spec.period_regex && spec.period_groups) {
    try {
      const periodRe = new RegExp(spec.period_regex, spec.period_regex_flags || '');
      const pm = fullText.match(periodRe);
      if (pm) {
        const g = spec.period_groups;
        const startKey = String(pm[g.start_month] || '').toUpperCase().slice(0,3);
        const endKey = String(pm[g.end_month] || '').toUpperCase().slice(0,3);
        let startYear = parseInt(pm[g.start_year], 10);
        let endYear = parseInt(pm[g.end_year], 10);
        // Compact 2-digit years like TD Business's "JAN 30/26" → 2026. Anything under
        // 100 is treated as a 20YY value; full 4-digit years pass through unchanged.
        if (startYear && startYear < 100) startYear += 2000;
        if (endYear && endYear < 100) endYear += 2000;
        const startMonth = MONTH_ABBR[startKey];
        const endMonth = MONTH_ABBR[endKey];
        // Single-year header format ("FROM JUN 10 TO JUL 9, 2025") omits the start year.
        // Default start_year to end_year; if start month > end month it's a year crossing.
        if (!startYear && endYear && startMonth && endMonth) {
          startYear = endYear;
          if (parseInt(startMonth, 10) > parseInt(endMonth, 10)) startYear = endYear - 1;
        }
        if (startMonth && endMonth && startYear && endYear) {
          matched = true;
          map = {};
          let y = startYear;
          let mm = parseInt(startMonth, 10);
          const endMm = parseInt(endMonth, 10);
          for (let safety = 0; safety < 36; safety++) {
            map[mm] = y;
            if (y === endYear && mm === endMm) break;
            mm++;
            if (mm > 12) { mm = 1; y++; }
          }
        }
        // End-date-only headers (e.g. BMO's "For the period ending April 17, 2026"
        // captures only end_month + end_year). Build a trailing-12-month map: months
        // ≤ end_month resolve to end_year, later months to end_year - 1. Safe for any
        // statement whose look-back doesn't exceed ~11 months.
        if (!matched && !startMonth && endMonth && endYear) {
          matched = true;
          map = {};
          const endMm = parseInt(endMonth, 10);
          for (let mm = 1; mm <= 12; mm++) {
            map[mm] = mm <= endMm ? endYear : endYear - 1;
          }
        }
      }
    } catch (e) { /* invalid period_regex — fall back */ }
  }
  const resolver = (dateStr, postedStr) => {
    if (map && dateStr) {
      const match = String(dateStr).trim().match(/^([A-Za-z]{3})/);
      if (match) {
        const key = MONTH_ABBR[match[1].toUpperCase()];
        if (key) {
          const transMm = parseInt(key, 10);
          if (map[transMm]) return map[transMm];
          // Transaction month falls outside the statement period (e.g. a late-posted
          // refund whose underlying purchase was months earlier). Posted dates are
          // always within the period, and posted ≥ transaction in calendar time, so
          // anchor off the posted month: same year if trans ≤ post, prior year if not.
          if (postedStr) {
            const pmatch = String(postedStr).trim().match(/^([A-Za-z]{3})/);
            if (pmatch) {
              const postKey = MONTH_ABBR[pmatch[1].toUpperCase()];
              if (postKey) {
                const postMm = parseInt(postKey, 10);
                if (map[postMm]) return transMm <= postMm ? map[postMm] : map[postMm] - 1;
              }
            }
          }
        }
      }
    }
    return fallbackYear;
  };
  resolver.matchedPeriod = matched;
  return resolver;
}

// Core: spec + raw → Transaction[]
async function applyConverter(file, raw, spec, ctx={}) {
  const txns = [];
  const errors = [];
  const accountType = spec.account_type || 'chequing';
  const currency = spec.default_currency || 'CAD';

  if (spec.type === 'csv') {
    const text = raw.kind === 'text' ? raw.data : new TextDecoder().decode(raw.data);
    const { headers, rows } = parseCSVText(text, spec);

    rows.forEach((row, i) => {
      try {
        const dateStr = getCell(row, spec.columns.transaction_date, headers);
        const postedStr = spec.columns.posted_date ? getCell(row, spec.columns.posted_date, headers) : null;
        const description = String(getCell(row, spec.columns.description, headers) || '').trim();
        if (!description && !dateStr) return; // empty row

        const transaction_date = parseDate(dateStr, spec.date_format || 'auto');
        if (!transaction_date) {
          errors.push({ row: i+1, error: `Could not parse date "${dateStr}"` });
          return;
        }
        const posted_date = postedStr ? parseDate(postedStr, spec.date_format || 'auto') : null;

        let signed = null;
        if (spec.amount_handling === 'split_debit_credit') {
          const debit = parseAmount(getCell(row, spec.columns.debit, headers));
          const credit = parseAmount(getCell(row, spec.columns.credit, headers));
          if (debit && debit !== 0) signed = -Math.abs(debit);    // debit = expense
          else if (credit && credit !== 0) signed = Math.abs(credit);  // credit = income/payment
          // For credit-card semantics, amounts should be flipped externally
        } else {
          signed = parseAmount(getCell(row, spec.columns.amount, headers));
        }

        if (signed === null) {
          errors.push({ row: i+1, error: 'Could not parse amount' });
          return;
        }

        // Sign normalization: we want signed where negative = money out (expense)
        // For chequing CSVs that already show that, sign is 'natural'.
        // For some credit-card CSVs: positive = charge (money out), so we 'flip'.
        if (spec.amount_sign === 'flipped') signed = -signed;

        const merchant = spec.columns.merchant
          ? (String(getCell(row, spec.columns.merchant, headers) || '').trim() || null)
          : null;
        const csvCategory = spec.columns.category
          ? (String(getCell(row, spec.columns.category, headers) || '').trim() || null)
          : null;

        const txnType = inferTxnType(signed, accountType, description);

        txns.push({
          transaction_date,
          posted_date,
          description,
          merchant,
          amount: Math.abs(signed),
          signed_amount: signed,
          currency,
          category: csvCategory,
          transaction_type: txnType,
          institution: spec.institution || ctx.institution,
          account_name: ctx.account_name || spec.default_account,
          account_type: accountType
        });
      } catch (e) {
        errors.push({ row: i+1, error: e.message });
      }
    });
  } else if (spec.type === 'pdf') {
    // Two PDF parsing modes share period_regex resolution and totals validation
    // but differ in row extraction:
    //   - layout: 'columns' uses pdfToRows + bucketByColumns (TD Business: debit
    //     vs credit is determined by x-coord, not by sign/keywords).
    //   - default (line_regex) uses pdfToText + regex per line (RBC, Amex, TD Aeroplan).
    const columnMode = spec.layout === 'columns' && Array.isArray(spec.columns);
    let text;
    let rows = null;
    if (columnMode) {
      rows = raw.kind === 'pdf' ? await pdfToRows(raw.data) : [];
      text = rows.map(r => r.items.map(it => it.str).join(' ')).join('\n');
    } else {
      text = raw.kind === 'pdf' ? await pdfToText(raw.data) : raw.data;
    }
    const fmt = spec.date_format || 'auto';
    const fallbackYear = spec.year || ctx.statement_year || new Date().getFullYear();
    const yearFor = buildYearResolver(text, spec, fallbackYear);

    if (spec.period_regex && !yearFor.matchedPeriod) {
      errors.push({
        row: 0,
        error: `Could not detect statement period from PDF header. All transactions assigned year ${fallbackYear} — dates may be wrong. Check the converter's period_regex.`
      });
    }

    if (columnMode) {
      // Optional section scoping for PDFs that bundle multiple accounts (e.g. BMO
      // Everyday Banking prints Primary Chequing and Interest Chequing in one file).
      // When account_section_regex is set, transactions only emit between a row
      // matching that regex (section start) and a row matching account_section_end_regex
      // (default: never, i.e. to end of file). Both run against the row's joined text.
      const sectionStartRe = spec.account_section_regex
        ? new RegExp(spec.account_section_regex, spec.account_section_regex_flags || '')
        : null;
      const sectionEndRe = spec.account_section_end_regex
        ? new RegExp(spec.account_section_end_regex, spec.account_section_end_regex_flags || '')
        : null;
      let inSection = !sectionStartRe; // no regex → every row counts
      // For merge_continuation_rows: tracks the most recently emitted txn so undated
      // wrap rows (BMO's "MSP/DIV", "PAY/PAY") can be appended to its description.
      let lastEmitted = null;

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const rowText = row.items.map(it => it.str).join(' ');
        if (sectionStartRe && !inSection) {
          if (sectionStartRe.test(rowText)) inSection = true;
          continue; // the header row itself isn't a transaction
        }
        if (sectionEndRe && sectionEndRe.test(rowText)) {
          inSection = false;
          lastEmitted = null;
          continue;
        }
        if (!inSection) continue;

        const b = bucketByColumns(row.items, spec.columns);
        const dateStr = b.date || '';
        const transaction_date = dateStr ? parseDate(dateStr, fmt, yearFor(dateStr)) : null;

        if (!transaction_date) {
          // Undated row inside the section — may be a continuation of the previous
          // transaction's description. Only merge if the row has description text
          // and no amounts (so we don't accidentally swallow a misaligned data row).
          if (spec.merge_continuation_rows && lastEmitted) {
            const cont = (b.description || '').trim();
            const hasAmounts = parseAmount(b.debit) || parseAmount(b.credit) || parseAmount(b.amount);
            if (cont && !hasAmounts) {
              lastEmitted.description = (lastEmitted.description + ' ' + cont).trim();
            }
          }
          continue;
        }

        let signed = null;
        if (spec.amount_handling === 'split_debit_credit') {
          const debit = parseAmount(b.debit);
          const credit = parseAmount(b.credit);
          if (debit && debit !== 0) signed = -Math.abs(debit);
          else if (credit && credit !== 0) signed = Math.abs(credit);
        } else {
          signed = parseAmount(b.amount);
        }
        if (signed === null || signed === 0) continue; // dated row with no debit/credit (e.g. BALANCE FORWARD)
        if (spec.amount_sign === 'flipped') signed = -signed;

        let description = (b.description || '').trim();
        if (spec.description_strip_regex) {
          try {
            const stripRe = new RegExp(spec.description_strip_regex, spec.description_strip_regex_flags || '');
            description = description.replace(stripRe, '').trim();
          } catch (e) { /* invalid regex — leave description as-is */ }
        }
        const txnType = inferTxnType(signed, accountType, description);
        const txn = {
          transaction_date,
          posted_date: null,
          description,
          merchant: null,
          amount: Math.abs(signed),
          signed_amount: signed,
          currency,
          category: null,
          transaction_type: txnType,
          institution: spec.institution || ctx.institution,
          account_name: ctx.account_name || spec.default_account,
          account_type: accountType
        };
        txns.push(txn);
        lastEmitted = txn;
      }
    } else {
    const lines = text.split('\n');
    const re = new RegExp(spec.line_regex, spec.line_regex_flags || '');
    // Amex-style statements split a transaction across two lines: date+description
    // on one line, signed amount on a following line. When next_line_amount_regex
    // is set, groups.amount indexes into THAT match instead of the line match.
    const amountRe = spec.next_line_amount_regex
      ? new RegExp(spec.next_line_amount_regex, spec.next_line_amount_regex_flags || '')
      : null;
    const amountLookahead = spec.next_line_amount_lookahead || 5;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const m = line.match(re);
      if (!m) continue;
      try {
        const dateStr = m[spec.groups.transaction_date];
        const postedStr = spec.groups.posted_date ? m[spec.groups.posted_date] : null;

        const transaction_date = parseDate(dateStr, fmt, yearFor(dateStr, postedStr));
        if (!transaction_date) {
          errors.push({ row: i+1, error: `Could not parse date "${dateStr}"` });
          continue;
        }
        const posted_date = postedStr ? parseDate(postedStr, fmt, yearFor(postedStr)) : null;
        const description = (m[spec.groups.description] || '').trim();

        // Resolve which match the amount lives in: same line (default) or a
        // subsequent line (when next_line_amount_regex is set). For the next-line
        // case, scan forward up to amountLookahead lines; stop if we hit another
        // transaction header before finding an amount.
        let amountMatch = m;
        if (amountRe) {
          let found = null;
          for (let j = 1; j <= amountLookahead && i + j < lines.length; j++) {
            const peek = lines[i + j];
            const am = peek.match(amountRe);
            if (am) { found = am; i = i + j; break; }
            if (peek.match(re)) break;
          }
          if (!found) {
            errors.push({ row: i+1, error: `Could not find amount on subsequent line for "${description}"` });
            continue;
          }
          amountMatch = found;
        }

        let signed = parseAmount(amountMatch[spec.groups.amount]);
        // Some PDF formats append 'CR' or '-' as a sign marker
        if (spec.groups.sign_marker && m[spec.groups.sign_marker]) {
          const sm = m[spec.groups.sign_marker];
          if (/-|CR/i.test(sm)) signed = -Math.abs(signed);
        }
        if (signed === null) { errors.push({ row: i+1, error: 'Could not parse amount' }); continue; }
        if (spec.amount_sign === 'flipped') signed = -signed;

        const txnType = inferTxnType(signed, accountType, description);
        txns.push({
          transaction_date, posted_date, description, merchant: null,
          amount: Math.abs(signed), signed_amount: signed, currency,
          category: null, transaction_type: txnType,
          institution: spec.institution || ctx.institution,
          account_name: ctx.account_name || spec.default_account,
          account_type: accountType
        });
      } catch (e) {
        errors.push({ row: i+1, error: e.message });
      }
    }
    }

    // Document-total sanity check. For each entry in spec.totals, scrape the
    // printed total(s) from the PDF text, apply the same amount_sign flip we
    // applied to individual transactions, then compare to the sum of parsed
    // signed_amount values matching the `match` filter ('all'/'positive'/
    // 'negative'). Always uses the /g flag so an entry like RBC's per-cardholder
    // SUBTOTAL — which appears once per cardholder — sums to the full document.
    // Missing matches are a soft skip (not every statement prints every total);
    // mismatches surface as a non-fatal warning in the review UI, not a block.
    if (Array.isArray(spec.totals) && txns.length > 0) {
      for (const tot of spec.totals) {
        try {
          const rawFlags = tot.regex_flags || '';
          const flags = rawFlags.includes('g') ? rawFlags : rawFlags + 'g';
          const re = new RegExp(tot.regex, flags);
          const matches = [...text.matchAll(re)];
          if (matches.length === 0) continue;

          let expected = 0;
          for (const m of matches) {
            const v = parseAmount(m[1]);
            if (v !== null) expected += v;
          }
          if (spec.amount_sign === 'flipped') expected = -expected;
          // When the printout is unsigned (e.g. TD Business "Debits 4 241.42") and
          // the filter implies a sign, align expected's sign with the filter so it
          // matches the filtered signed sum. Filters that capture a sign (e.g. Amex's
          // "-536.94") already have correct sign and this is a no-op.
          if (tot.match === 'negative' && expected > 0) expected = -expected;
          if (tot.match === 'positive' && expected < 0) expected = -expected;

          const filter = tot.match || 'all';
          const actual = txns.reduce((acc, t) => {
            if (filter === 'positive') return t.signed_amount > 0 ? acc + t.signed_amount : acc;
            if (filter === 'negative') return t.signed_amount < 0 ? acc + t.signed_amount : acc;
            return acc + t.signed_amount;
          }, 0);

          const delta = actual - expected;
          if (Math.abs(delta) > 0.01) {
            errors.push({
              row: 0,
              error: `Total mismatch — ${tot.label || 'document total'}: document shows ${formatMoney(expected, currency)}, parsed sum is ${formatMoney(actual, currency)} (Δ ${formatMoney(delta, currency)}). The import isn't blocked, but check the parsed rows against the statement.`
            });
          }
        } catch (e) { /* malformed totals entry — skip */ }
      }
    }
  } else {
    throw new Error(`Unknown spec type: ${spec.type}`);
  }

  return { transactions: txns, errors };
}

const RETIRED_BUILTIN_KEYS = new Set([
  'td_chequing_csv_v1', 'td_visa_csv_v1', 'td_aeroplan_visa_pdf_v1',
  'td_business_chequing_pdf_v1', 'rbc_chequing_csv_v1',
  'amex_ca_csv_v1', 'amex_platinum_pdf_v1', 'generic_csv_v1'
]);

async function seedBuiltins() {
  const existing = dao.listConverters();
  // Remove retired built-ins from existing DBs.
  existing.filter(c => c.is_builtin && RETIRED_BUILTIN_KEYS.has(c.key))
    .forEach(c => dao.deleteConverter(c.id));

  const existingKeys = new Set(dao.listConverters().map(c => c.key));
  for (const c of BUILTIN_CONVERTERS) {
    if (!existingKeys.has(c.key)) {
      dao.saveConverter({
        key: c.key, name: c.name, institution: c.institution,
        account_type: c.account_type, format: c.format,
        spec_json: JSON.stringify(c.spec), notes: c.notes, is_builtin: 1
      });
    }
  }
  migrateBuiltinSpecs(existing);
  // Backfill: transactions manually categorised as 'Transfer' before the
  // category→transaction_type sync was added. Safe to re-run (idempotent).
  for (const t of STORE.transactions) {
    if (t.category === 'Transfer' && t.transaction_type !== 'transfer') {
      t.transaction_type = 'transfer';
    }
  }
  persistDB();
}

// One-time, idempotent upgrades for built-in converter rows already in users' DBs.
// Each entry checks for the exact buggy value before overwriting, so re-runs are no-ops.
function migrateBuiltinSpecs(existing) {
  const OLD_RBC_VISA_PERIOD = 'STATEMENT\\s+FROM\\s+([A-Z]{3})\\s+\\d{1,2},\\s+(\\d{4})\\s+TO\\s+([A-Z]{3})\\s+\\d{1,2},\\s+(\\d{4})';
  const OLD_RBC_VISA_LINE = '^([A-Z]{3}\\s+\\d{1,2})\\s+([A-Z]{3}\\s+\\d{1,2})\\s+(.+?)\\s+(-?\\$[\\d,]+\\.\\d{2})$';
  const rbcVisa = existing.find(c => c.key === 'rbc_visa_pdf_v1');
  if (rbcVisa) {
    try {
      const spec = JSON.parse(rbcVisa.spec_json);
      const fresh = BUILTIN_CONVERTERS.find(b => b.key === 'rbc_visa_pdf_v1');
      const needsPeriodFix = spec.period_regex === OLD_RBC_VISA_PERIOD;
      const needsLineFix = spec.line_regex === OLD_RBC_VISA_LINE;
      const needsTotals = !Array.isArray(spec.totals);
      if (fresh && (needsPeriodFix || needsLineFix || needsTotals)) {
        dao.saveConverter({
          id: rbcVisa.id,
          key: rbcVisa.key,
          name: fresh.name,
          institution: fresh.institution,
          account_type: fresh.account_type,
          format: fresh.format,
          spec_json: JSON.stringify(fresh.spec),
          notes: fresh.notes
        });
      }
    } catch (e) { /* malformed spec_json — leave alone */ }
  }

  // BMO Interest Chequing: relax kerning-sensitive regexes (\s+ → \s*) and add
  // description_strip_regex so the noise prefix "Pre-Authorized Payment, " /
  // "Online Bill Payment, " doesn't dominate the truncated review column.
  // Detects the old spec by either using the strict \s+ pattern or lacking the
  // strip regex; rewrites the row with the fresh spec.
  const bmo = existing.find(c => c.key === 'bmo_interest_chequing_pdf_v1');
  if (bmo) {
    try {
      const spec = JSON.parse(bmo.spec_json);
      const fresh = BUILTIN_CONVERTERS.find(b => b.key === 'bmo_interest_chequing_pdf_v1');
      const needsStripRegex = !spec.description_strip_regex;
      const needsLooserStartRe = spec.account_section_regex && spec.account_section_regex.includes('\\s+');
      const needsLooserEndRe = spec.account_section_end_regex === 'Closing\\s+totals';
      if (fresh && (needsStripRegex || needsLooserStartRe || needsLooserEndRe)) {
        dao.saveConverter({
          id: bmo.id,
          key: bmo.key,
          name: fresh.name,
          institution: fresh.institution,
          account_type: fresh.account_type,
          format: fresh.format,
          spec_json: JSON.stringify(fresh.spec),
          notes: fresh.notes
        });
      }
    } catch (e) { /* malformed spec_json — leave alone */ }
  }
}

function applyDefaultRules(description) {
  const desc = (description || '').toLowerCase();
  for (const [pattern, cat] of DEFAULT_RULES) {
    if (new RegExp(pattern, 'i').test(desc)) return cat;
  }
  return null;
}

function applyUserRules(description, rules) {
  const desc = (description || '').toLowerCase();
  for (const r of rules) {
    if (r.match_type === 'regex') {
      try { if (new RegExp(r.pattern, 'i').test(desc)) return r.category; } catch {}
    } else if (r.match_type === 'startswith') {
      if (desc.startsWith(r.pattern.toLowerCase())) return r.category;
    } else {
      if (desc.includes(r.pattern.toLowerCase())) return r.category;
    }
  }
  return null;
}

function autoCategorize(transaction, userRules=[]) {
  if (transaction.category) return transaction.category;
  // Type-based shortcuts
  if (transaction.transaction_type === 'cc_payment') return 'Credit Card Payment';
  if (transaction.transaction_type === 'transfer') return 'Transfer';
  if (transaction.transaction_type === 'income') {
    return applyUserRules(transaction.description, userRules) || applyDefaultRules(transaction.description) || 'Income';
  }
  if (transaction.transaction_type === 'refund') return 'Refund';
  return applyUserRules(transaction.description, userRules) || applyDefaultRules(transaction.description) || 'Other';
}

// Try to extract a clean merchant name from a noisy description
function extractMerchant(description) {
  if (!description) return null;
  let s = description
    .replace(/\s+#\d+/g,'')
    .replace(/\s+\d{6,}/g,'')
    .replace(/\s+ON\b|\s+QC\b|\s+BC\b|\s+AB\b/g,'')
    .replace(/\s+CANADA$/i,'')
    .replace(/\s{2,}/g,' ')
    .trim();
  // Take the first 4 word-ish tokens
  const words = s.split(/\s+/).slice(0, 4).join(' ');
  return words.length > 2 ? words : null;
}

/* === MODULE 6: BOOTSTRAP HELPER =========================================
   When no converter exists for a (institution, format) combo, we suggest
   a converter spec by analyzing the file content heuristically. The user
   can then refine and save it. (This is the "LLM bootstrap" step from the
   spec — implemented as smart heuristics so it works offline; an external
   LLM call could be swapped in here later.)
   ========================================================================== */

function suggestCSVSpec(text) {
  // Try a couple of common delimiters; pick the one with most consistent column counts
  const delimiters = [',',';','\t','|'];
  let best = null;
  for (const d of delimiters) {
    const p = Papa.parse(text.slice(0, 10000), { delimiter: d, skipEmptyLines: true });
    if (!p.data.length) continue;
    const counts = p.data.slice(0, 30).map(r => r.length);
    const max = Math.max(...counts);
    const consistency = counts.filter(c => c === max).length / counts.length;
    if (max >= 3 && consistency > 0.6 && (!best || max * consistency > best.score)) {
      best = { delimiter: d, score: max * consistency, data: p.data, max };
    }
  }
  if (!best) return null;

  const { delimiter, data } = best;
  // Detect header: first row has more text-like cells, no numbers
  const first = data[0];
  const looksLikeHeader = first.every(c => c && !/^-?\$?\d/.test(String(c).trim()));
  const has_header = looksLikeHeader;
  const headers = has_header ? first.map(h => String(h).trim()) : null;
  const sample = has_header ? data.slice(1, 6) : data.slice(0, 5);

  const out = {
    type: 'csv',
    has_header,
    delimiter,
    columns: {},
    date_format: 'auto',
    amount_handling: 'single_signed',
    amount_sign: 'natural',
    account_type: 'chequing',
    default_account: '',
    default_currency: 'CAD'
  };

  // Detect columns
  const numCols = sample[0]?.length || 0;
  const colStats = [];
  for (let i = 0; i < numCols; i++) {
    const vals = sample.map(r => r[i] || '');
    const numeric = vals.filter(v => !isNaN(parseAmount(v)) && parseAmount(v) !== null).length;
    const date = vals.filter(v => parseDate(v, 'auto')).length;
    const textLen = vals.reduce((a,v) => a + String(v).length, 0) / Math.max(vals.length,1);
    colStats.push({ i, numeric, date, textLen, header: headers?.[i] || `Column ${i+1}` });
  }

  // Date column: highest date count, preferring earliest column
  const dateCol = colStats.filter(c => c.date >= sample.length / 2).sort((a,b) => b.date - a.date || a.i - b.i)[0];
  if (dateCol) out.columns.transaction_date = headers ? headers[dateCol.i] : dateCol.i;

  // Description column: longest average text length, not date/numeric
  const descCol = colStats
    .filter(c => c !== dateCol && c.numeric < sample.length / 2)
    .sort((a,b) => b.textLen - a.textLen)[0];
  if (descCol) out.columns.description = headers ? headers[descCol.i] : descCol.i;

  // Amount columns: numeric columns. If two and they're labeled "debit"/"credit" or "withdrawal"/"deposit", split.
  const amountCols = colStats.filter(c => c !== dateCol && c.numeric >= sample.length / 2);
  if (amountCols.length >= 2 && headers) {
    const debitName = headers.find(h => /debit|withdrawal|out|paid/i.test(h));
    const creditName = headers.find(h => /credit|deposit|in|received/i.test(h));
    if (debitName && creditName) {
      out.amount_handling = 'split_debit_credit';
      out.columns.debit = debitName;
      out.columns.credit = creditName;
    } else {
      // Fall back to first numeric col as single signed
      out.columns.amount = headers ? headers[amountCols[0].i] : amountCols[0].i;
    }
  } else if (amountCols.length === 1) {
    out.columns.amount = headers ? headers[amountCols[0].i] : amountCols[0].i;
  } else if (amountCols.length === 2 && !headers) {
    // No headers, two numeric cols: assume split debit/credit
    out.amount_handling = 'split_debit_credit';
    out.columns.debit = amountCols[0].i;
    out.columns.credit = amountCols[1].i;
  }

  // Detect date format from a sample value
  if (dateCol) {
    const v = String(sample.find(r => r[dateCol.i])?.[dateCol.i] || '').trim();
    if (/^\d{4}-\d{1,2}-\d{1,2}/.test(v)) out.date_format = 'YYYY-MM-DD';
    else if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(v)) out.date_format = 'MM/DD/YYYY';
    else if (/^\d{1,2}\/\d{1,2}\/\d{2}\b/.test(v)) out.date_format = 'MM/DD/YY';
    else if (/^\d{1,2}-\d{1,2}-\d{4}/.test(v)) out.date_format = 'DD-MM-YYYY';
  }

  return { spec: out, headers, sample, sniff: best };
}

function suggestPDFSpec(text) {
  // Look for repeating "date description amount" lines
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  // Try a few canonical regexes
  const candidates = [
    {
      name: 'MM/DD MM/DD desc $amount',
      regex: '^(\\d{1,2}/\\d{1,2})\\s+(\\d{1,2}/\\d{1,2})\\s+(.+?)\\s+\\$?(-?[\\d,]+\\.\\d{2})$',
      groups: { transaction_date: 1, posted_date: 2, description: 3, amount: 4 },
      date_format: 'MM/DD'
    },
    {
      name: 'MM/DD desc $amount',
      regex: '^(\\d{1,2}/\\d{1,2})\\s+(.+?)\\s+\\$?(-?[\\d,]+\\.\\d{2})$',
      groups: { transaction_date: 1, description: 2, amount: 3 },
      date_format: 'MM/DD'
    },
    {
      name: 'YYYY-MM-DD desc amount',
      regex: '^(\\d{4}-\\d{2}-\\d{2})\\s+(.+?)\\s+\\$?(-?[\\d,]+\\.\\d{2})$',
      groups: { transaction_date: 1, description: 2, amount: 3 },
      date_format: 'YYYY-MM-DD'
    },
    {
      name: 'Mon DD desc amount',
      regex: '^([A-Z][a-z]{2}\\s+\\d{1,2})\\s+(.+?)\\s+\\$?(-?[\\d,]+\\.\\d{2})$',
      groups: { transaction_date: 1, description: 2, amount: 3 },
      date_format: 'auto'
    }
  ];

  let best = null;
  for (const c of candidates) {
    const re = new RegExp(c.regex);
    const matches = lines.filter(l => re.test(l)).length;
    if (matches >= 3 && (!best || matches > best.matches)) best = { ...c, matches };
  }

  if (!best) return null;

  // Year detection
  const yearMatch = text.match(/\b(20\d{2})\b/);
  const year = yearMatch ? parseInt(yearMatch[1], 10) : new Date().getFullYear();

  return {
    spec: {
      type: 'pdf',
      line_regex: best.regex,
      groups: best.groups,
      date_format: best.date_format,
      year,
      amount_handling: 'single_signed',
      amount_sign: 'natural',
      account_type: 'credit_card',
      default_account: '',
      default_currency: 'CAD'
    },
    sample_matches: lines.filter(l => new RegExp(best.regex).test(l)).slice(0, 5),
    candidate: best
  };
}

const AppContext = createContext(null);

const initialState = {
  view: 'upload',           // upload | review | transactions | reports | converters | history
  ready: false,             // DB initialized
  toast: null,              // { kind: 'success' | 'error' | 'info', message }
  pendingReview: null,      // { documentId, transactions, errors, account, converter }
  batchQueue: [],           // [{ parsedReview }] — files awaiting review in a batch upload
  batchStats: null,         // { total, autoImported, queuedForReview, skippedNoHint, errors, skippedNames }
  refreshKey: 0             // bump to refresh derived data
};

function reducer(state, action) {
  switch (action.type) {
    case 'SET_READY':       return { ...state, ready: true };
    case 'SET_VIEW':        return { ...state, view: action.view };
    case 'TOAST':           return { ...state, toast: action.toast };
    case 'CLEAR_TOAST':     return { ...state, toast: null };
    case 'SET_REVIEW':      return { ...state, pendingReview: action.payload, view: 'review' };
    case 'CLEAR_REVIEW':    return { ...state, pendingReview: null };
    case 'SET_BATCH':       return { ...state, batchQueue: action.queue, batchStats: action.stats };
    case 'BATCH_ADVANCE':   return { ...state, batchQueue: state.batchQueue.slice(1) };
    case 'CLEAR_BATCH':     return { ...state, batchQueue: [], batchStats: null };
    case 'REFRESH':         return { ...state, refreshKey: state.refreshKey + 1 };
    default: return state;
  }
}

   Components:
     UploadView (top-level)
       DropZone (file picker / drag-drop)

// Strip extension, dates, and long digit runs so monthly statements with
// rotating date suffixes ("Visa Statement-6503 2025-01-09.pdf" vs "...2025-02-09.pdf")
// collapse to the same normalized stem.
function normalizeFilenameForMatch(name) {
  return String(name || '')
    .replace(/\.[a-z0-9]+$/i, '')                           // drop extension
    .replace(/\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/g, '')          // YYYY-MM-DD / YYYY/MM/DD
    .replace(/\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}/g, '')        // MM-DD-YYYY / DD-MM-YYYY
    .replace(/\d{4}[-\/]\d{1,2}/g, '')                      // YYYY-MM (no day)
    .replace(/(january|february|march|april|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)/gi, '')
    .replace(/\d{4,}/g, '')                                 // long digit runs (years, account stubs)
    .replace(/[\s\-_]+/g, ' ')
    .trim()
    .toLowerCase();
}

// Look up a previous upload that matches this filename so we can suggest
// reusing its converter + account. Exact filename wins; otherwise the
// normalized-stem match (most recent first).
function findReuseHint(filename) {
  const docs = dao.listDocuments();
  if (!docs.length || !filename) return null;
  let match = docs.find(d => d.filename === filename && d.converter_id);
  if (!match) {
    const target = normalizeFilenameForMatch(filename);
    if (target) match = docs.find(d => d.converter_id && normalizeFilenameForMatch(d.filename) === target);
  }
  if (!match) return null;
  const converter = dao.getConverter(match.converter_id);
  if (!converter) return null;
  const account = match.account_id ? dao.listAccounts().find(a => a.id === match.account_id) : null;
  return { doc: match, converter, account };
}

// Parse one file with a chosen converter and return everything needed to
// either show a review screen or auto-import. Inserts the document at parse
// time (status 'parsed' on success) and counts duplicates against the DB.
// Throws if applyConverter / readFileForParse fails.
async function parseFileWithConverter(file, converter, { institution = '', accountType = '', accountName = '' } = {}) {
  const spec = JSON.parse(converter.spec_json);
  const raw = await readFileForParse(file, converter.format);
  const acctName = accountName || spec.default_account || `${institution} ${spec.account_type || ''}`.trim();
  const resolvedInstitution = institution || spec.institution || '';
  const account_id = dao.upsertAccount({
    institution: resolvedInstitution,
    account_name: acctName,
    account_type: accountType || spec.account_type,
    currency: spec.default_currency || 'CAD'
  });
  const document_id = dao.insertDocument({
    filename: file.name, format: converter.format,
    institution: resolvedInstitution, account_id, converter_id: converter.id,
    status: 'parsing', raw_size: file.size
  });
  const result = await applyConverter(file, raw, spec, {
    institution: resolvedInstitution, account_name: acctName, statement_year: new Date().getFullYear()
  });
  const userRules = dao.listCategoryRules();
  const enriched = await Promise.all(result.transactions.map(async t => ({
    ...t,
    merchant: t.merchant || extractMerchant(t.description),
    category: t.category || autoCategorize(t, userRules),
    is_excluded: false,
    document_id, account_id,
    fingerprint: await fingerprint([t.transaction_date, t.amount, t.transaction_type, t.description, acctName])
  })));
  let duplicateCount = 0;
  enriched.forEach(t => {
    if (dao.isDuplicate(account_id, t.fingerprint)) {
      t._duplicate = true;
      duplicateCount++;
    }
  });
  dao.updateDocumentStatus(document_id, 'parsed');
  return {
    document_id,
    account_id,
    account_name: acctName,
    institution: resolvedInstitution,
    converter,
    transactions: enriched,
    errors: result.errors,
    duplicateCount
  };
}

function formatBatchSummary(stats) {
  if (!stats) return '';
  const parts = [];
  if (stats.autoImported) parts.push(`${stats.autoImported} imported`);
  if (stats.queuedForReview) parts.push(`${stats.queuedForReview} to review`);
  if (stats.skippedNoHint) parts.push(`${stats.skippedNoHint} unrecognized`);
  if (stats.errors) parts.push(`${stats.errors} failed`);
  return `Batch: ${parts.join(', ') || 'no files processed'}`;
}

    </div>
  );
}
