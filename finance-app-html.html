        activeLabel === preset.label
          ? 'bg-emerald-600 text-white shadow-sm'
          : 'bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-800'
      }`}
    >
      {preset.label}
    </button>
  );

  return (
    <Card className="mb-6">
      <div className="px-4 pt-3 pb-3 flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-slate-100">
        <div className="flex items-center gap-1.5 flex-wrap">
          <span className="text-xs font-semibold text-slate-400 uppercase tracking-wide mr-0.5">Months</span>
          {presets.months.map(p => <PresetPill key={p.label} preset={p} />)}
        </div>
        <div className="w-px h-5 bg-slate-200 hidden sm:block self-center" />
        <div className="flex items-center gap-1.5 flex-wrap">
          <span className="text-xs font-semibold text-slate-400 uppercase tracking-wide mr-0.5">Years</span>
          {presets.years.map(p => <PresetPill key={p.label} preset={p} />)}
        </div>
      </div>
      <div className="p-4 grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
        <div>
          <Label>From</Label>
          <Input type="date" value={from} onChange={e => setFrom(e.target.value)} />
        </div>
        <div>
          <Label>To</Label>
          <Input type="date" value={to} onChange={e => setTo(e.target.value)} />
        </div>
        <div>
          <Label>Account</Label>
          <Select value={accountFilter} onChange={e => setAccountFilter(e.target.value)}>
            <option value="">All accounts</option>
            {accounts.map(a => <option key={a.id} value={a.id}>{a.institution} · {a.account_name}</option>)}
          </Select>
        </div>
        <div className="md:col-span-2 flex items-center gap-4 pb-2">
          <label className="flex items-center gap-2 text-sm">
            <input type="checkbox" checked={excludeTransfers} onChange={e => setExcludeTransfers(e.target.checked)} className="rounded border-slate-300" />
            Exclude transfers
          </label>
          <label className="flex items-center gap-2 text-sm">
            <input type="checkbox" checked={excludePayments} onChange={e => setExcludePayments(e.target.checked)} className="rounded border-slate-300" />
            Exclude CC payments
          </label>
        </div>
      </div>
    </Card>
  );
}

function SummaryStrip({ totalExpense, totalIncome, net, count, from, to }) {
  const months = useMemo(() => {
    if (!from || !to) return 1;
    const a = new Date(from), b = new Date(to);
    const m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + 1;
    return Math.max(1, m);
  }, [from, to]);
  return (
    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
      <StatTile label="Total expenses" value={formatMoney(totalExpense)} color="red" sublabel={`${count} transactions`} />
      <StatTile label="Total income" value={formatMoney(totalIncome)} color="green" />
      <StatTile label="Net" value={formatMoney(net)} color={net >= 0 ? 'green' : 'red'} />
      <StatTile label="Avg / month" value={formatMoney(totalExpense / months)} sublabel={`across ${months} ${months === 1 ? 'month' : 'months'}`} />
    </div>
  );
}

// --- Chart wrappers
function useChart(canvasRef, factory, deps) {
  useEffect(() => {
    if (!canvasRef.current) return;
    const chart = factory(canvasRef.current);
    return () => chart && chart.destroy();
  }, deps);
}

function MonthlyExpensesChart({ expenses, income }) {
  const ref = useRef(null);
  useChart(ref, (el) => {
    const months = {};
    // `expenses` / `income` are already filtered by the parent's isSpend/isInflow,
    // which include un-excluded transfers/cc_payments. Trust those buckets here
    // instead of re-filtering by transaction_type, which would drop them.
    expenses.forEach(t => {
      const k = monthKey(t.transaction_date);
      if (!months[k]) months[k] = { exp: 0, inc: 0 };
      months[k].exp += t.amount;
    });
    income.forEach(t => {
      const k = monthKey(t.transaction_date);
      if (!months[k]) months[k] = { exp: 0, inc: 0 };
      months[k].inc += t.amount;
    });
    const keys = Object.keys(months).sort();
    return new Chart(el, {
      type: 'bar',
      data: {
        labels: keys.map(monthLabel),
        datasets: [
          { label: 'Expenses', data: keys.map(k => months[k].exp), backgroundColor: '#ef4444' },
          { label: 'Income', data: keys.map(k => months[k].inc), backgroundColor: '#10b981' }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'top' } },
        scales: { y: { beginAtZero: true, ticks: { callback: v => '$'+v } } }
      }
    });
  }, [expenses, income]);
  return <div className="relative h-72"><canvas ref={ref} /></div>;
}

function CategoryBreakdownChart({ expenses }) {

  useChart(ref, (el) => {
    const sorted = Object.entries(data).sort((a,b) => b[1] - a[1]).slice(0, 10);

      type: 'doughnut',
      data: {
        labels: sorted.map(([k]) => k),

}

      m[key].count++;
      m[key].total += t.amount;
      m[key].txns.push(t);

function MonthOverMonthTable({ expenses }) {
  const rows = useMemo(() => {
    const months = {};
    expenses.forEach(t => {
      const k = monthKey(t.transaction_date);
      months[k] = (months[k] || 0) + t.amount;
    });
    const keys = Object.keys(months).sort();
    return keys.map((k, i) => {
      const prev = i > 0 ? months[keys[i-1]] : null;
      const delta = prev ? ((months[k] - prev) / prev) * 100 : null;
      return { month: k, total: months[k], delta };
    }).reverse();
  }, [expenses]);

  return (
    <div className="overflow-auto">
      <table className="w-full text-sm">
        <thead className="bg-slate-50 text-slate-600 text-xs uppercase tracking-wide">
          <tr>
            <th className="text-left px-4 py-2">Month</th>
            <th className="text-right px-4 py-2">Total</th>
            <th className="text-right px-4 py-2">vs. prev.</th>
          </tr>
        </thead>
        <tbody className="divide-y divide-slate-200">
          {rows.map(r => (
            <tr key={r.month}>
              <td className="px-4 py-2">{monthLabel(r.month)}</td>
              <td className="px-4 py-2 text-right font-mono">{formatMoney(r.total)}</td>
              <td className={classNames('px-4 py-2 text-right font-mono text-xs', r.delta == null ? 'text-slate-400' : r.delta > 0 ? 'text-red-600' : 'text-emerald-600')}>
                {r.delta == null ? '—' : `${r.delta > 0 ? '+' : ''}${r.delta.toFixed(1)}%`}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {rows.length === 0 && <div className="py-6 text-center text-sm text-slate-500">No data.</div>}
    </div>
  );
}

function HistoryView() {
  const { state, dispatch } = useApp();
  const [docs, setDocs] = useState([]);
  const [confirmDoc, setConfirmDoc] = useState(null);

  useEffect(() => { setDocs(dao.listDocuments()); }, [state.refreshKey]);

  const statusColor = s => s === 'imported' ? 'green' : s === 'needs_converter' ? 'amber' : 'slate';

  const confirmTxnCount = confirmDoc ? dao.countTransactionsForDocument(confirmDoc.id) : 0;

  const handleDelete = () => {
    if (!confirmDoc) return;
    const id = confirmDoc.id;
    const filename = confirmDoc.filename;
    const removed = confirmTxnCount;
    dao.deleteDocument(id);
    setConfirmDoc(null);
    dispatch({ type: 'REFRESH' });

      kind: 'success',
      message: `Deleted "${filename}"${removed ? ` and ${removed} transaction${removed !== 1 ? 's' : ''}` : ''}`

    <PageContainer>
      <div className="mb-6">
        <h2 className="text-xl font-semibold text-slate-900">Upload history</h2>
        <p className="text-sm text-slate-500 mt-1">{docs.length} document{docs.length !== 1 ? 's' : ''} uploaded</p>
      </div>
      {docs.length === 0
        ? <EmptyState icon="🗂" title="No uploads yet" description="Upload a bank statement to get started." />
        : (
          <Card>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 text-slate-600 text-xs uppercase tracking-wide border-b border-slate-200">
                  <tr>
                    <th className="text-left px-4 py-3">Date</th>
                    <th className="text-left px-4 py-3">File</th>
                    <th className="text-left px-4 py-3">Institution</th>
                    <th className="text-left px-4 py-3">Account</th>
                    <th className="text-left px-4 py-3">Converter</th>
                    <th className="text-left px-4 py-3">Status</th>
                    <th className="text-right px-4 py-3 w-16">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {docs.map(d => (
                    <tr key={d.id} className="hover:bg-slate-50">
                      <td className="px-4 py-3 whitespace-nowrap font-mono text-xs text-slate-600">
                        {new Date(d.uploaded_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })}
                      </td>
                      <td className="px-4 py-3 max-w-[240px]">
                        <span className="truncate block" title={d.filename}>{d.filename}</span>
                        {d.format && <span className="text-xs text-slate-400 uppercase">{d.format}</span>}
                      </td>
                      <td className="px-4 py-3 text-slate-700">{d.institution || <span className="text-slate-400">—</span>}</td>
                      <td className="px-4 py-3 text-slate-700">{d.account_name || <span className="text-slate-400">—</span>}</td>
                      <td className="px-4 py-3 text-slate-700">{d.converter_name || <span className="text-slate-400">—</span>}</td>
                      <td className="px-4 py-3">
                        <Badge color={statusColor(d.status)}>{d.status}</Badge>
                      </td>
                      <td className="px-4 py-3 text-right">
                        <button
                          onClick={() => setConfirmDoc(d)}
                          title="Delete document and its transactions"
                          className="text-slate-400 hover:text-red-600 text-base"
                        >🗑</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        )
      }
      <Modal
        open={!!confirmDoc}
        onClose={() => setConfirmDoc(null)}
        title="Delete document?"
        size="sm"
        footer={
          <>
            <Button variant="ghost" onClick={() => setConfirmDoc(null)}>Cancel</Button>
            <Button variant="danger" onClick={handleDelete}>Delete</Button>
          </>
        }
      >
        {confirmDoc && (
          <div className="text-sm text-slate-700 space-y-3">
            <p>
              Delete <span className="font-mono break-all">{confirmDoc.filename}</span>?
            </p>
            <p className="text-slate-600">
              {confirmTxnCount === 0
                ? 'No transactions are linked to this document.'
                : <>This will also remove <strong>{confirmTxnCount}</strong> linked transaction{confirmTxnCount !== 1 ? 's' : ''}.</>}
            </p>
            <p className="text-xs text-slate-500">This cannot be undone.</p>
          </div>
        )}
      </Modal>
    </PageContainer>
  );
}

function ConvertersView() {
  const { state, dispatch } = useApp();
  const [items, setItems] = useState([]);
  const [editing, setEditing] = useState(null);

  const [usageCounts, setUsageCounts] = useState({});

  const refresh = () => {
    setItems(dao.listConverters());
    const counts = {};
    STORE.documents.forEach(d => {
      if (d.converter_id) counts[d.converter_id] = (counts[d.converter_id] || 0) + 1;
    });
    setUsageCounts(counts);
  };
  useEffect(refresh, [state.refreshKey]);

  const onDelete = (c) => {
    if (!confirm(`Delete converter "${c.name}"? This won't affect already-imported transactions.`)) return;
    dao.deleteConverter(c.id);
    refresh();
    dispatch({ type: 'TOAST', toast: { kind: 'success', message: 'Converter deleted' } });
  };

  return (
    <PageContainer>
      <PageHeader
        title="Converters"
        description="Each converter parses one institution's document format deterministically. Edit, copy, or delete them — built-ins can be edited too."
        action={<SystemActions onChange={refresh} />}
      />

      <Card>
        <CardHeader title={`${items.length} converters`} />
        <ConverterList items={items} usageCounts={usageCounts} onView={c => setEditing(c)} onDelete={onDelete} />
      </Card>

      {editing && (
        <ConverterDetailModal
          converter={editing}
          onClose={() => setEditing(null)}
          onSaved={() => { setEditing(null); refresh(); dispatch({ type: 'TOAST', toast: { kind: 'success', message: 'Saved' } }); }}
        />
      )}
    </PageContainer>
  );
}

function ConverterDetailModal({ converter, onClose, onSaved }) {
  const [name, setName] = useState(converter.name);
  const [notes, setNotes] = useState(converter.notes || '');
  const [specText, setSpecText] = useState(JSON.stringify(JSON.parse(converter.spec_json), null, 2));
  const [error, setError] = useState(null);

  const save = () => {
    try {
      const parsed = JSON.parse(specText);
      dao.saveConverter({
        id: converter.id, key: converter.key, name,
        institution: converter.institution, account_type: converter.account_type,
        format: converter.format, spec_json: JSON.stringify(parsed),
        notes
      });
      onSaved();
    } catch (e) {
      setError('Invalid JSON: ' + e.message);
    }
  };

  return (
    <Modal
      open={true}
      onClose={onClose}
      title={`Converter: ${converter.name}`}
      size="lg"
      footer={
        <>
          <Button variant="ghost" onClick={onClose}>Close</Button>
          <Button onClick={save}>Save</Button>
        </>
      }
    >
      <div className="space-y-4">
        <div className="grid grid-cols-2 gap-3">
          <div>
            <Label>Name</Label>
            <Input value={name} onChange={e => setName(e.target.value)} />

          <div>

          </div>
        </div>
        <div>
          <Label>Notes</Label>
          <Input value={notes} onChange={e => setNotes(e.target.value)} placeholder="Notes about this format…" />
        </div>
        <div>
          <Label>Spec (JSON)</Label>
          <textarea
            value={specText}
            onChange={e => setSpecText(e.target.value)}
            className="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-mono focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none"
            rows="20"
          />
        </div>
        {error && <div className="text-sm text-red-600">{error}</div>}
      </div>
    </Modal>
  );
}

function SystemActions({ onChange }) {
  const { dispatch } = useApp();
  const fileRef = useRef(null);

  const reset = async () => {
    if (!confirm('This will delete ALL data — transactions, accounts, custom converters. Continue?')) return;
    await dao.resetAll();
    await seedBuiltins();
    onChange();
    dispatch({ type: 'TOAST', toast: { kind: 'success', message: 'Reset complete' } });
  };

  const exportDB = () => {
    const data = dao.exportDB();
    downloadBlob(data, 'household_finance.json', 'application/json');
  };

  const importDB = async (file) => {
    if (!file) return;
    if (!confirm('Replace all data with this backup file?')) return;
    const buf = await file.arrayBuffer();
    try {
      await dao.importDB(new Uint8Array(buf));
      onChange();
      dispatch({ type: 'TOAST', toast: { kind: 'success', message: 'Backup imported' } });
      dispatch({ type: 'REFRESH' });
    } catch (e) {
      dispatch({ type: 'TOAST', toast: { kind: 'error', message: 'Import failed: ' + e.message } });
    }
  };

  return (
    <div className="flex gap-2">
      <input ref={fileRef} type="file" accept=".json" className="hidden"
        onChange={e => { importDB(e.target.files[0]); e.target.value=''; }} />
      <Button variant="ghost" size="sm" onClick={() => fileRef.current?.click()}>Import backup</Button>
      <Button variant="secondary" size="sm" onClick={exportDB}>Export backup</Button>
      <Button variant="danger" size="sm" onClick={reset}>Reset all</Button>
    </div>
  );
}

/* === MODULE 16: APP ROOT ================================================ */

function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const [bootError, setBootError] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        await initDB();
        await seedBuiltins();
        dispatch({ type: 'SET_READY' });
      } catch (e) {
        console.error(e);
        setBootError(e.message);
      }
    })();
  }, []);

  if (bootError) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6">
        <Card className="max-w-md p-6">
          <div className="text-red-600 font-semibold mb-2">Failed to initialize</div>
          <div className="text-sm text-slate-600">{bootError}</div>
          <Button className="mt-4" onClick={() => location.reload()}>Reload</Button>
        </Card>
      </div>
    );
  }

  if (!state.ready) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-slate-500 text-sm">Loading…</div>
      </div>
    );
  }

  const ctx = { state, dispatch };

  return (
    <AppContext.Provider value={ctx}>
      <Header />
      {state.view === 'upload' && <UploadView />}
      {state.view === 'review' && <ReviewView />}
      {state.view === 'transactions' && <TransactionsView />}
      {state.view === 'reports' && <ReportsView />}
      {state.view === 'history' && <HistoryView />}
      {state.view === 'converters' && <ConvertersView />}
      <Toast toast={state.toast} onClose={() => dispatch({ type: 'CLEAR_TOAST' })} />
      <Footer />
    </AppContext.Provider>
  );
}

function Footer() {
  return (
    <footer className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-xs text-slate-400">
      Local-only · {STORAGE_MODE === 'idb' ? 'IndexedDB' : STORAGE_MODE === 'localstorage' ? 'localStorage' : 'In-memory (use Export to save)'} · No data leaves your machine
    </footer>
  );
}

/* === MOUNT ============================================================== */
const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
