function ConverterMatchPanel({ file, format, institution, accountType, onConverterChosen, onNeedConverter, onNeedAIConverter }) {
  // Find matching converters for this institution + format
  const candidates = useMemo(() => {
    if (!institution || !format) return [];
    return dao.findConverters({ institution, format });
  }, [institution, format]);

  const exact = candidates.filter(c => !accountType || c.account_type === accountType);
  const list = exact.length ? exact : candidates;

  if (!institution || !format) {
    return <div className="text-sm text-slate-500">Pick an institution to see matching converters.</div>;
  }
  if (list.length === 0) {
    return (
      <div className="rounded-lg bg-amber-50 border border-amber-200 p-4">
        <div className="text-sm font-medium text-amber-900">No converter exists for {institution} ({format.toUpperCase()})</div>
        <p className="text-xs text-amber-800 mt-1">
          Let AI analyze the file and build a reusable converter for you, or set one up manually. Once saved, future uploads from {institution} will skip this step.
        </p>
        <div className="mt-3 flex flex-wrap gap-2">
          <Button onClick={onNeedAIConverter}>✨ Set up with AI</Button>
          <Button variant="secondary" onClick={onNeedConverter}>Bootstrap manually</Button>
        </div>
      </div>
    );
  }
  return (
    <div className="space-y-2">
      <div className="text-xs text-slate-500">Choose a converter for this document:</div>
      {list.map(c => (
        <button
          key={c.id}
          onClick={() => onConverterChosen(c)}
          className="w-full text-left rounded-lg border border-slate-200 hover:border-brand-500 hover:bg-brand-50 p-3 transition-colors"
        >
          <div className="flex items-start justify-between gap-2">
            <div>
              <div className="text-sm font-medium text-slate-900">{c.name}</div>
              <div className="text-xs text-slate-500 mt-0.5">{c.institution} · {c.format.toUpperCase()} · {ACCOUNT_TYPE_LABEL[c.account_type] || 'Any'}</div>
            </div>
            {c.is_builtin ? <Badge color="blue">Built-in</Badge> : <Badge color="violet">Custom</Badge>}
          </div>
        </button>
      ))}
      <div className="text-xs text-slate-500 pt-1">
        None of these match? <button onClick={onNeedAIConverter} className="text-brand-600 hover:underline">Set up with AI ✨</button>
        {' '}or <button onClick={onNeedConverter} className="text-brand-600 hover:underline">bootstrap manually →</button>
      </div>
    </div>
  );
}

function UploadView() {
  const { state, dispatch } = useApp();
  const [file, setFile] = useState(null);
  const [format, setFormat] = useState(null);
  const [previewText, setPreviewText] = useState('');
  const [institution, setInstitution] = useState('');
  const [accountType, setAccountType] = useState('');
  const [accountName, setAccountName] = useState('');
  const [bootstrapOpen, setBootstrapOpen] = useState(false);
  const [aiWizardOpen, setAiWizardOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const [recent, setRecent] = useState([]);
  const [reuseHint, setReuseHint] = useState(null);

  useEffect(() => { setRecent(dao.listDocuments().slice(0, 8)); }, [state.refreshKey]);

  const handleFile = async (files) => {
    const f = files[0];
    setFile(f);
    const detectedFormat = detectFormat(f.name, await f.slice(0, 200).text().catch(() => ''));
    setFormat(detectedFormat);

    const hint = findReuseHint(f.name);
    if (hint && hint.converter.format === detectedFormat) {
      setReuseHint(hint);
      setInstitution(hint.doc.institution || hint.converter.institution || '');
      setAccountType(hint.account?.account_type || hint.converter.account_type || '');
      setAccountName(hint.account?.account_name || '');
    } else {
      setReuseHint(null);
      setAccountName('');
    }

    if (detectedFormat === 'csv' || detectedFormat === 'unknown') {
      const t = await f.text();
      setPreviewText(t.slice(0, 2000));
    } else if (detectedFormat === 'pdf') {
      try {
        const buf = await f.arrayBuffer();
        const text = await pdfToText(new Uint8Array(buf));
        setPreviewText(text.slice(0, 2000));
      } catch (e) {
        setPreviewText('(PDF preview failed: ' + e.message + ')');
      }
    }
  };

  const onConverterChosen = async (converter) => {
    if (!file) return;
    setBusy(true);
    try {
      const parsed = await parseFileWithConverter(file, converter, { institution, accountType, accountName });
      const { duplicateCount, ...payload } = parsed;
      dispatch({ type: 'SET_REVIEW', payload });
      dispatch({ type: 'TOAST', toast: { kind: 'success', message: `Parsed ${parsed.transactions.length} transactions` } });
    } catch (e) {
      console.error(e);
      dispatch({ type: 'TOAST', toast: { kind: 'error', message: 'Parse failed: ' + e.message } });
    } finally {
      setBusy(false);
    }
  };

  const handleFiles = async (files) => {
    // Single-file drop reuses the existing configure-then-parse flow.
    if (files.length === 1) {
      dispatch({ type: 'CLEAR_BATCH' });
      return handleFile(files);
    }
    // Multi-file batch: parse each via its reuse hint, auto-import the clean ones,
    // queue the rest for one-by-one review.
    dispatch({ type: 'CLEAR_BATCH' });
    setBusy(true);
    const stats = { total: files.length, autoImported: 0, queuedForReview: 0, skippedNoHint: 0, errors: 0, skippedNames: [] };
    const pendingForReview = [];
    for (const f of files) {
      try {
        const sniff = await f.slice(0, 200).text().catch(() => '');
        const detectedFormat = detectFormat(f.name, sniff);
        const hint = findReuseHint(f.name);
        if (!hint || hint.converter.format !== detectedFormat) {
          stats.skippedNoHint++;
          stats.skippedNames.push(f.name);
          continue;
        }
        const parsed = await parseFileWithConverter(f, hint.converter, {
          institution: hint.doc.institution || hint.converter.institution || '',
          accountType: hint.account?.account_type || hint.converter.account_type || '',
          accountName: hint.account?.account_name || ''
        });
        const clean = parsed.errors.length === 0 && parsed.duplicateCount === 0 && parsed.transactions.length > 0;
        if (clean) {
          const toInsert = parsed.transactions.map(t => ({
            document_id: parsed.document_id,
            account_id: parsed.account_id,
            transaction_date: t.transaction_date,
            posted_date: t.posted_date,
            description: t.description,
            merchant: t.merchant,
            amount: t.amount,
            currency: t.currency,
            category: t.category,
            transaction_type: t.transaction_type,
            is_excluded: t.is_excluded ? 1 : 0,
            fingerprint: t.fingerprint
          }));
          dao.bulkInsertTransactions(toInsert);
          dao.updateDocumentStatus(parsed.document_id, 'imported');
          stats.autoImported++;
        } else {
          const { duplicateCount, ...parsedReview } = parsed;
          pendingForReview.push({ parsedReview });
          stats.queuedForReview++;
        }
      } catch (e) {
        console.error('batch parse error', f.name, e);
        stats.errors++;
      }
    }
    setBusy(false);
    if (pendingForReview.length > 0) {
      dispatch({ type: 'SET_BATCH', queue: pendingForReview.slice(1), stats });
      dispatch({ type: 'SET_REVIEW', payload: pendingForReview[0].parsedReview });
    } else {
      dispatch({ type: 'SET_BATCH', queue: [], stats });
      if (stats.autoImported > 0) dispatch({ type: 'REFRESH' });
      dispatch({ type: 'TOAST', toast: { kind: 'success', message: formatBatchSummary(stats) } });
    }
  };

  const showBatchSummary = state.batchStats && state.batchQueue.length === 0 && !state.pendingReview;

  return (
    <PageContainer>
      <PageHeader
        title="Upload statement"
        description="Drop a CSV or PDF — drop several at once to auto-import recognized files in one shot. We'll detect the format, find a matching converter, and parse transactions deterministically."
      />

      {showBatchSummary && (
        <div className="mb-6 p-4 bg-emerald-50 border border-emerald-200 rounded-lg">
          <div className="flex items-start justify-between gap-3">
            <div className="text-sm">
              <div className="font-medium text-emerald-900">Batch upload complete</div>
              <div className="mt-1 text-emerald-800">
                {state.batchStats.autoImported > 0 && <span><span className="font-semibold">{state.batchStats.autoImported}</span> auto-imported</span>}
                {state.batchStats.autoImported > 0 && (state.batchStats.queuedForReview > 0 || state.batchStats.skippedNoHint > 0 || state.batchStats.errors > 0) && <span> · </span>}
                {state.batchStats.queuedForReview > 0 && <span><span className="font-semibold">{state.batchStats.queuedForReview}</span> reviewed</span>}
                {state.batchStats.queuedForReview > 0 && (state.batchStats.skippedNoHint > 0 || state.batchStats.errors > 0) && <span> · </span>}
                {state.batchStats.skippedNoHint > 0 && <span><span className="font-semibold">{state.batchStats.skippedNoHint}</span> unrecognized</span>}
                {state.batchStats.skippedNoHint > 0 && state.batchStats.errors > 0 && <span> · </span>}
                {state.batchStats.errors > 0 && <span><span className="font-semibold text-red-700">{state.batchStats.errors}</span> failed</span>}
              </div>
              {state.batchStats.skippedNames?.length > 0 && (
                <details className="mt-2 text-xs text-emerald-800">
                  <summary className="cursor-pointer hover:underline">Skipped files (drop individually to set up converter)</summary>
                  <ul className="mt-1 ml-4 list-disc font-mono text-slate-700">
                    {state.batchStats.skippedNames.map(n => <li key={n}>{n}</li>)}
                  </ul>
                </details>
              )}
            </div>
            <Button variant="ghost" size="sm" onClick={() => dispatch({ type: 'CLEAR_BATCH' })}>Dismiss</Button>
          </div>
        </div>
      )}

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div className="lg:col-span-2 space-y-6">
          {!file ? (
            <DropZone onFiles={handleFiles} multiple />
          ) : (
            <Card>
              <CardHeader
                title={file.name}
                subtitle={`${(file.size/1024).toFixed(1)} KB · detected ${format?.toUpperCase() || '?'}`}
                right={<Button variant="ghost" size="sm" onClick={() => { setFile(null); setPreviewText(''); setReuseHint(null); }}>Change</Button>}
              />
              <div className="p-5">
                <Label>Preview</Label>
                <pre className="mt-1 text-xs bg-slate-50 border border-slate-200 rounded p-3 max-h-48 overflow-auto scrollbar-thin font-mono whitespace-pre-wrap">{previewText || '(empty)'}</pre>
              </div>
            </Card>
          )}

          {file && reuseHint && (
            <Card>
              <div className="p-5 border-l-4 border-emerald-500 bg-emerald-50 rounded-r-lg">
                <div className="text-sm font-medium text-emerald-900">
                  Matches a previous upload — reuse <span className="font-semibold">{reuseHint.converter.name}</span>?
                </div>
                <div className="text-xs text-emerald-800 mt-1">
                  Filename matches <span className="font-mono">{reuseHint.doc.filename}</span>
                  {reuseHint.account ? <> · account <span className="font-medium">{reuseHint.account.account_name}</span></> : null}
                  {reuseHint.doc.uploaded_at ? <> · last used {new Date(reuseHint.doc.uploaded_at).toLocaleDateString()}</> : null}
                </div>
                <div className="mt-3 flex gap-2">
                  <Button onClick={() => onConverterChosen(reuseHint.converter)} disabled={busy}>
                    Use {reuseHint.converter.name} →
                  </Button>
                  <Button variant="ghost" onClick={() => setReuseHint(null)}>
                    Choose a different converter
                  </Button>
                </div>
              </div>
            </Card>
          )}

          {file && (
            <Card>
              <CardHeader title="2. Choose a converter" subtitle="Match this document to an institution + format" />
              <div className="p-5 space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div>
                    <Label>Institution</Label>
                    <InstitutionPicker value={institution} onChange={setInstitution} />
                  </div>
                  <div>
                    <Label>Account type</Label>
                    <Select value={accountType} onChange={e => setAccountType(e.target.value)}>
                      <option value="">Any</option>
                      {ACCOUNT_TYPES.map(t => <option key={t} value={t}>{ACCOUNT_TYPE_LABEL[t]}</option>)}
                    </Select>
                  </div>
                  <div>
                    <Label>Account name</Label>
                    <Input
                      placeholder="e.g. TD Visa - Joint"
                      value={accountName}
                      onChange={e => setAccountName(e.target.value)}
                    />
                  </div>
                </div>
                <ConverterMatchPanel
                  file={file}
                  format={format}
                  institution={institution}
                  accountType={accountType}
                  onConverterChosen={onConverterChosen}
                  onNeedConverter={() => setBootstrapOpen(true)}
                  onNeedAIConverter={() => setAiWizardOpen(true)}
                />
              </div>
            </Card>
          )}
        </div>

        <div className="space-y-6">
          <RecentUploads recent={recent} />
          <BuiltInsCallout />
        </div>
      </div>

      <BootstrapWizard
        open={bootstrapOpen}
        onClose={() => setBootstrapOpen(false)}
        file={file}
        format={format}
        previewText={previewText}
        defaults={{ institution, accountType, accountName }}
        onSaved={converter => {
          setBootstrapOpen(false);
          dispatch({ type: 'TOAST', toast: { kind: 'success', message: `Saved converter "${converter.name}"` } });
          // Auto-run the new converter
          onConverterChosen(converter);
        }}
      />

      <AIConverterWizard
        open={aiWizardOpen}
        onClose={() => setAiWizardOpen(false)}
        file={file}
        format={format}
        defaults={{ institution, accountType, accountName }}
        onSaved={converter => {
          setAiWizardOpen(false);
          dispatch({ type: 'TOAST', toast: { kind: 'success', message: `Saved converter "${converter.name}"` } });
          onConverterChosen(converter);
        }}
      />

      {busy && <div className="fixed inset-0 bg-slate-900/30 z-40 flex items-center justify-center"><div className="bg-white rounded-lg px-6 py-4 shadow-lg">Parsing…</div></div>}
    </PageContainer>
  );
}

/* === MODULE 11: BOOTSTRAP WIZARD ========================================
   When a user uploads a document for an institution we have no converter
   for, this wizard analyzes the file and proposes a spec. The user reviews
   column mappings (CSV) or regex (PDF), watches a live preview, and saves
   the converter. From then on, it's used deterministically — no LLM needed.

   Components:
     BootstrapWizard (modal container)
       CSVConverterEditor
       PDFConverterEditor
       LivePreview
   ========================================================================== */

function BootstrapWizard({ open, onClose, file, format, previewText, defaults, onSaved }) {
  const [stage, setStage] = useState('analyzing');
  const [spec, setSpec] = useState(null);
  const [meta, setMeta] = useState({
    name: '',
    institution: defaults?.institution || '',
    account_type: defaults?.accountType || '',
    default_account: defaults?.accountName || '',
    notes: ''
  });
  const [csvContext, setCsvContext] = useState(null); // { headers, sample }

  useEffect(() => {
    if (!open || !file) return;
    setStage('analyzing');
    (async () => {
      try {
        if (format === 'csv') {
          const text = await file.text();
          const sug = suggestCSVSpec(text);
          if (sug) {
            setSpec(sug.spec);
            setCsvContext({ headers: sug.headers, sample: sug.sample });
            setMeta(m => ({
              ...m,
              name: m.institution ? `${m.institution} (CSV)` : 'New CSV Converter',
              account_type: m.account_type || sug.spec.account_type,
              default_account: m.default_account || ''
            }));
          } else {
            setSpec({
              type: 'csv', has_header: true, delimiter: ',',
              columns: { transaction_date: 'Date', description: 'Description', amount: 'Amount' },
              date_format: 'auto', amount_handling: 'single_signed', amount_sign: 'natural',
              account_type: 'chequing', default_account: '', default_currency: 'CAD'
            });
          }
          setStage('csv-editor');
        } else if (format === 'pdf') {
          const buf = await file.arrayBuffer();
          const text = await pdfToText(new Uint8Array(buf));
          const sug = suggestPDFSpec(text);
          if (sug) {
            setSpec(sug.spec);
            setMeta(m => ({ ...m, name: m.institution ? `${m.institution} (PDF)` : 'New PDF Converter' }));
          } else {
            setSpec({
              type: 'pdf',
              line_regex: '^(\\d{1,2}/\\d{1,2})\\s+(.+?)\\s+\\$?(-?[\\d,]+\\.\\d{2})$',
              groups: { transaction_date: 1, description: 2, amount: 3 },
              date_format: 'MM/DD',
              year: new Date().getFullYear(),
              amount_handling: 'single_signed', amount_sign: 'natural',
              account_type: 'credit_card', default_account: '', default_currency: 'CAD'
            });
          }
          setStage('pdf-editor');
        }
      } catch (e) {
        console.error(e);
        setStage('error');
      }
    })();
  }, [open, file, format]);

  const save = () => {
    if (!spec || !meta.institution || !meta.name) return;
    const finalSpec = {
      ...spec,
      account_type: meta.account_type || spec.account_type,
      default_account: meta.default_account || spec.default_account,
      institution: meta.institution
    };
    const key = `${meta.institution}_${format}_${uid().slice(0,4)}`.toLowerCase().replace(/\s+/g,'_');
    const id = dao.saveConverter({
      key, name: meta.name, institution: meta.institution,
      account_type: meta.account_type, format,
      spec_json: JSON.stringify(finalSpec), notes: meta.notes
    });
    onSaved(dao.getConverter(id));
  };

  return (
    <Modal
      open={open}
      onClose={onClose}
      title={`Bootstrap a new ${format === 'pdf' ? 'PDF' : 'CSV'} converter`}
      size="xl"
      footer={
        <>
          <Button variant="ghost" onClick={onClose}>Cancel</Button>
          <Button onClick={save} disabled={!spec || !meta.institution || !meta.name}>
            Save converter & parse
          </Button>
        </>
      }
    >
      <div className="text-sm text-slate-600 mb-4">
        We've analyzed the document and proposed a converter. Review the mapping, tweak as needed, then save. This converter will be reused automatically for all future uploads from this institution.
      </div>

      <ConverterMetaForm meta={meta} setMeta={setMeta} />

      {stage === 'analyzing' && <div className="mt-6 text-sm text-slate-500">Analyzing document…</div>}
      {stage === 'error' && <div className="mt-6 text-sm text-red-600">Could not analyze this document. Try a different format or set the spec manually.</div>}

      {stage === 'csv-editor' && spec && (
        <CSVConverterEditor spec={spec} setSpec={setSpec} ctx={csvContext} />
      )}
      {stage === 'pdf-editor' && spec && (
        <PDFConverterEditor spec={spec} setSpec={setSpec} previewText={previewText} />
      )}

      {spec && (
        <div className="mt-6">
          <Label>Live preview (first 5 transactions)</Label>
          <LivePreview file={file} spec={spec} format={format} />
        </div>
      )}
    </Modal>
  );
}

      <div>

function CSVConverterEditor({ spec, setSpec, ctx }) {
  const headerOptions = ctx?.headers || [];
  const set = (path, value) => {
    setSpec(s => {
      const next = { ...s };
      const keys = path.split('.');
      let obj = next;
      for (let i = 0; i < keys.length - 1; i++) {
        obj[keys[i]] = { ...obj[keys[i]] };
        obj = obj[keys[i]];
      }
      obj[keys[keys.length - 1]] = value;
      return next;
    });
  };

  const columnPicker = (label, key, optional=false) => (
    <div>
      <Label>{label}{!optional && ' *'}</Label>
      {headerOptions.length > 0 ? (
        <Select value={spec.columns[key] ?? ''} onChange={e => set(`columns.${key}`, e.target.value || null)}>
          <option value="">—</option>
          {headerOptions.map(h => <option key={h} value={h}>{h}</option>)}
        </Select>
      ) : (
        <Input
          type="number"
          value={spec.columns[key] ?? ''}
          onChange={e => set(`columns.${key}`, e.target.value === '' ? null : parseInt(e.target.value, 10))}
          placeholder="Column index (0-based)"
        />
      )}
    </div>
  );

  return (
    <div className="mt-6 space-y-4">
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <Label>Delimiter</Label>
          <Select value={spec.delimiter} onChange={e => set('delimiter', e.target.value)}>
            <option value=",">Comma (,)</option>
            <option value=";">Semicolon (;)</option>
            <option value="\t">Tab</option>
            <option value="|">Pipe (|)</option>
          </Select>
        </div>
        <div>
          <Label>Has header row?</Label>

function PDFConverterEditor({ spec, setSpec, previewText }) {
  const set = (path, value) => {
    setSpec(s => {
      const next = { ...s };
      const keys = path.split('.');
      let obj = next;
      for (let i = 0; i < keys.length - 1; i++) {
        obj[keys[i]] = { ...obj[keys[i]] };
        obj = obj[keys[i]];
      }
      obj[keys[keys.length - 1]] = value;
      return next;
    });
  };
  return (
    <div className="mt-6 space-y-4">
      <div>
        <Label>Line regex</Label>
        <Input
          className="font-mono text-xs"
          value={spec.line_regex}
          onChange={e => set('line_regex', e.target.value)}
        />
        <p className="text-xs text-slate-500 mt-1">Should match a single transaction line. Use capture groups for date / description / amount.</p>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div>
          <Label>Date group #</Label>
          <Input type="number" value={spec.groups.transaction_date} onChange={e => set('groups.transaction_date', parseInt(e.target.value,10))} />
        </div>
        <div>
          <Label>Posted date group #</Label>
          <Input type="number" value={spec.groups.posted_date || ''} onChange={e => set('groups.posted_date', e.target.value ? parseInt(e.target.value,10) : null)} />
        </div>
        <div>
          <Label>Description group #</Label>
          <Input type="number" value={spec.groups.description} onChange={e => set('groups.description', parseInt(e.target.value,10))} />
        </div>
        <div>
          <Label>Amount group #</Label>
          <Input type="number" value={spec.groups.amount} onChange={e => set('groups.amount', parseInt(e.target.value,10))} />
        </div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <Label>Date format</Label>
          <Select value={spec.date_format} onChange={e => set('date_format', e.target.value)}>
            <option value="MM/DD">MM/DD (year inferred)</option>
            <option value="DD/MM">DD/MM (year inferred)</option>
            <option value="MM/DD/YYYY">MM/DD/YYYY</option>
            <option value="YYYY-MM-DD">YYYY-MM-DD</option>
            <option value="auto">Auto</option>
          </Select>
        </div>
        <div>
          <Label>Statement year (for MM/DD)</Label>
          <Input type="number" value={spec.year} onChange={e => set('year', parseInt(e.target.value,10))} />
        </div>
        <div>
          <Label>Sign convention</Label>
          <Select value={spec.amount_sign} onChange={e => set('amount_sign', e.target.value)}>
            <option value="natural">Natural</option>
            <option value="flipped">Flipped (credit card)</option>

      <details>
        <summary className="text-xs text-brand-600 hover:underline cursor-pointer">Show extracted text</summary>
        <pre className="mt-2 text-xs bg-slate-50 border border-slate-200 rounded p-3 max-h-48 overflow-auto scrollbar-thin font-mono whitespace-pre-wrap">{previewText || ''}</pre>
      </details>
    </div>
  );
}

function LivePreview({ file, spec, format }) {
  const [preview, setPreview] = useState({ rows: [], err: null });
  useEffect(() => {
    let cancel = false;
    (async () => {
      try {
        const raw = await readFileForParse(file, format);
        const result = await applyConverter(file, raw, spec, {});
        if (!cancel) setPreview({ rows: result.transactions.slice(0, 5), err: null, total: result.transactions.length });
      } catch (e) {
        if (!cancel) setPreview({ rows: [], err: e.message });
      }
    })();
    return () => { cancel = true; };
  }, [file, JSON.stringify(spec), format]);

  if (preview.err) return <div className="text-sm text-red-600">{preview.err}</div>;
  if (preview.rows.length === 0) return <div className="text-sm text-slate-500">No transactions matched yet. Adjust the spec above.</div>;

  return (
    <div>
      <div className="text-xs text-slate-500 mb-2">Showing 5 of {preview.total}.</div>
      <div className="border border-slate-200 rounded-lg overflow-hidden">
        <table className="w-full text-xs">
          <thead className="bg-slate-50 text-slate-600">
            <tr>
              <th className="text-left px-3 py-2">Date</th>
              <th className="text-left px-3 py-2">Description</th>
              <th className="text-right px-3 py-2">Amount</th>
              <th className="text-left px-3 py-2">Type</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-200">
            {preview.rows.map((t,i) => (
              <tr key={i}>
                <td className="px-3 py-2 font-mono">{t.transaction_date}</td>
                <td className="px-3 py-2 truncate max-w-[400px]">{t.description}</td>
                <td className={classNames('px-3 py-2 text-right font-mono', t.signed_amount < 0 ? 'text-red-600' : 'text-emerald-600')}>
                  {formatMoney(t.signed_amount)}
                </td>
                <td className="px-3 py-2">{TXN_TYPE_LABEL[t.transaction_type]}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* --- AI-assisted converter authoring ------------------------------------
   APIKeyModal stores the user's own provider key in localStorage (never in
   the exported DB blob). AIConverterWizard drives an interactive loop: it
   sends a document excerpt to the model, gets back a converter spec, validates
   it locally with applyConverter (auto-retrying on errors), and lets the user
   refine it in chat while watching a live transaction preview.
   ------------------------------------------------------------------------ */

function APIKeyModal({ open, onClose, onSaved }) {
  const [provider, setProvider] = useState('anthropic');
  const [key, setKey] = useState('');
  useEffect(() => {
    if (!open) return;
    const c = getLLMConfig();
    setProvider(c.provider);
    setKey(localStorage.getItem(LLM_KEY_STORAGE[c.provider]) || '');
  }, [open]);
  const onProvider = (p) => { setProvider(p); setKey(localStorage.getItem(LLM_KEY_STORAGE[p]) || ''); };
  const save = () => { setLLMConfig({ provider, apiKey: key }); onSaved && onSaved(); };
  return (
    <Modal
      open={open}
      onClose={onClose}
      title="Connect an AI model"
      size="md"
      footer={
        <>
          <Button variant="ghost" onClick={onClose}>Cancel</Button>
          <Button onClick={save} disabled={!key.trim()}>Save key</Button>
        </>
      }
    >
      <p className="text-sm text-slate-600 mb-4">
        The AI only writes the parser spec — it never sees your transactions, which are parsed locally. Bring your own API key from either provider.
      </p>
      <div className="space-y-3">
        <div>
          <Label>Provider</Label>
          <Select value={provider} onChange={e => onProvider(e.target.value)}>
            {Object.entries(LLM_PROVIDERS).map(([id, p]) => <option key={id} value={id}>{p.label}</option>)}
          </Select>
        </div>
        <div>
          <Label>API key</Label>
          <Input type="password" value={key} onChange={e => setKey(e.target.value)} placeholder={provider === 'anthropic' ? 'sk-ant-…' : 'sk-…'} autoComplete="off" />
          <p className="text-xs text-slate-500 mt-1">
            Default model: <span className="font-mono">{LLM_PROVIDERS[provider]?.defaultModel}</span>.{' '}
            <a href={LLM_PROVIDERS[provider]?.keyUrl} target="_blank" rel="noreferrer" className="text-brand-600 hover:underline">Get a key →</a>
          </p>
        </div>
        <div className="rounded-lg bg-amber-50 border border-amber-200 p-3 text-xs text-amber-800">
          The key is stored only in this browser's local storage and sent directly to {LLM_PROVIDERS[provider]?.label}. It is excluded from DB exports. Because this page loads libraries from CDNs, treat the key as exposed to this page — use a key you can rotate.
        </div>
      </div>
    </Modal>
  );
}

function AIConverterWizard({ open, onClose, file, format, defaults, onSaved }) {
  const [stage, setStage] = useState('notice'); // 'notice' | 'key' | 'analyzing' | 'chat'
  const [messages, setMessages] = useState([]);    // { role:'user'|'assistant'|'auto'|'note', text, display?, spec? }
  const [spec, setSpec] = useState(null);
  const [parseResult, setParseResult] = useState(null); // { rows, errors, error }
  const [busy, setBusy] = useState(false);
  const [fatal, setFatal] = useState(null);
  const [input, setInput] = useState('');
  const [meta, setMeta] = useState({
    name: '', institution: defaults?.institution || '', account_type: defaults?.accountType || '',
    default_account: defaults?.accountName || '', notes: ''
  });
  const scrollRef = useRef(null);
  const cfg = getLLMConfig();

  useEffect(() => {
    if (!open || !file) return;
    setMessages([]); setSpec(null); setParseResult(null); setFatal(null); setInput('');
    setMeta(m => ({ ...m, name: defaults?.institution ? `${defaults.institution} (${(format || '').toUpperCase()}, AI)` : `New ${(format || '').toUpperCase()} converter` }));
    setStage('notice');
  }, [open, file]);

  function handleNoticeConfirmed() {
    const conf = getLLMConfig();
    if (!conf.apiKey) { setStage('key'); return; }
    startAnalysis();
  }

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, busy]);

  async function extractDocContext() {
    if (format === 'csv' || format === 'unknown') {
      const text = await file.text();
      return text.split(/\r?\n/).slice(0, 60).join('\n').slice(0, 6000);
    }
    const buf = await file.arrayBuffer();
    const u8 = new Uint8Array(buf);
    const text = await pdfToText(u8);
    let ctx = text.slice(0, 5000);
    try {
      const rows = await pdfToRows(u8);
      const sample = rows.slice(0, 45).map(r =>
        'y=' + r.y + ' | ' + r.items.map(it => `[x=${Math.round(it.x)}]${it.str}`).join(' ')
      ).join('\n').slice(0, 4000);
      ctx += '\n\n--- ITEM X-COORDINATES (first rows; use these to set x_min/x_max for layout:"columns") ---\n' + sample;
    } catch (_) {}
    return ctx;
  }

  function buildApiMessages(list) {
    return list.filter(m => m.role !== 'note').map(m => {
      if (m.role === 'assistant') {
        return { role: 'assistant', content: (m.text || '') + (m.spec ? '\n\nProposed spec:\n```json\n' + JSON.stringify(m.spec) + '\n```' : '') };
      }
      return { role: 'user', content: m.text };
    });
  }

  async function validate(s) {
    try {
      const raw = await readFileForParse(file, format);
      const result = await applyConverter(file, raw, s, {});
      return { rows: result.transactions, errors: result.errors || [], error: null };
    } catch (e) {
      return { rows: [], errors: [], error: e.message };
    }
  }

  function summarize(pr) {
    if (!pr) return 'No parse run yet.';
    if (pr.error) return 'The engine threw an error: ' + pr.error;
    const out = [`Parsed ${pr.rows.length} transaction(s); ${pr.errors.length} warning(s).`];
    if (pr.errors.length) out.push('Warnings:\n' + pr.errors.slice(0, 10).map(e => e.row ? `Row ${e.row}: ${e.error}` : e.error).join('\n'));
    if (pr.rows.length) out.push('Sample parsed rows:\n' + pr.rows.slice(0, 4).map(t => `${t.transaction_date} | ${t.description} | ${formatMoney(t.signed_amount)} | ${t.transaction_type}`).join('\n'));
    return out.join('\n');
  }

  async function callModel(list) {
    const conf = getLLMConfig();
    const { spec: newSpec, text } = await callLLM({ provider: conf.provider, apiKey: conf.apiKey, model: conf.model, messages: buildApiMessages(list) });
    return { newSpec: normalizeWizardSpec(newSpec), text };
  }

  async function startAnalysis() {
    setStage('analyzing'); setBusy(true); setFatal(null);
    try {
      const ctx = await extractDocContext();
      const firstText = `Document type: ${(format || '').toUpperCase()}\nFilename: ${file.name}\n\nDocument excerpt:\n---\n${ctx}\n---\n\nAnalyze this statement and produce a converter spec.`;
      let list = [{ role: 'user', text: firstText, display: `Analyze ${file.name}` }];
      setMessages(list); setStage('chat');
      let { newSpec, text } = await callModel(list);
      let pr = await validate(newSpec);
      list = [...list, { role: 'assistant', text, spec: newSpec }];
      setMessages(list); setSpec(newSpec); setParseResult(pr);
      // Auto-validation loop: feed parse errors back to the model before handing
      // control to the user, so the first thing they see is already close.
      for (let i = 0; i < 2; i++) {
        const clean = !pr.error && pr.rows.length > 0 && pr.errors.length === 0;
        if (clean) break;
        const autoText = 'Automatic validation result:\n' + summarize(pr) + '\n\nPlease correct the spec so all transaction rows parse cleanly.';
        list = [...list, { role: 'auto', text: autoText, display: `Auto-check: ${pr.error ? 'engine error' : pr.errors.length + ' warning(s)'} — asking the model to fix` }];
        setMessages(list);
        const r = await callModel(list);
        newSpec = r.newSpec;
        pr = await validate(newSpec);
        list = [...list, { role: 'assistant', text: r.text, spec: newSpec }];
        setMessages(list); setSpec(newSpec); setParseResult(pr);
      }
    } catch (e) {
      console.error(e);
      setFatal(e.message);
    } finally {
      setBusy(false);
    }
  }

  async function send() {
    const text = input.trim();
    if (!text || busy) return;
    setInput(''); setBusy(true); setFatal(null);
    try {
      const userText = text + '\n\nFor reference, the current parse result is:\n' + summarize(parseResult);
      let list = [...messages, { role: 'user', text: userText, display: text }];
      setMessages(list);
      const { newSpec, text: expl } = await callModel(list);
      const pr = await validate(newSpec);
      list = [...list, { role: 'assistant', text: expl, spec: newSpec }];
      setMessages(list); setSpec(newSpec); setParseResult(pr);
    } catch (e) {
      console.error(e);
      setFatal(e.message);
    } finally {
      setBusy(false);
    }
  }

  function doSave() {
    if (!spec || !meta.institution || !meta.name) return;
    const finalSpec = normalizeWizardSpec({
      ...spec,
      account_type: meta.account_type || spec.account_type,
      default_account: meta.default_account || spec.default_account,
      institution: meta.institution,
    });
    const key = `${meta.institution}_${format}_${uid().slice(0, 4)}`.toLowerCase().replace(/\s+/g, '_');
    const id = dao.saveConverter({
      key, name: meta.name, institution: meta.institution,
      account_type: meta.account_type, format,
      spec_json: JSON.stringify(finalSpec), notes: meta.notes,
    });
    onSaved(dao.getConverter(id));
  }

  if (!open) return null;

  if (stage === 'notice') {
    return (
      <Modal open={open} onClose={onClose} title="Set up a converter with AI"
        footer={<><Button variant="ghost" onClick={onClose}>Cancel</Button><Button onClick={handleNoticeConfirmed}>Got it, proceed</Button></>}>
        <div className="space-y-4 max-w-xl">
          <div className="rounded-lg bg-amber-50 border border-amber-200 p-4 text-sm text-amber-900">
            <p className="font-semibold mb-2">Consider removing personal information first</p>
            <p className="mb-3 text-amber-800">
              The wizard will send a portion of your document to an AI model to learn its format.
              The AI only needs to see the structure — not your actual data.
            </p>
            <p className="font-medium mb-1">Consider redacting:</p>
            <ul className="list-disc list-inside space-y-1 text-amber-800 mb-3">
              <li>Your name and address</li>
              <li>Full account numbers (keeping the last 4 digits is fine)</li>
              <li>Exact balances (replace with $0.00)</li>
              <li>Any other personal identifiers in the header</li>
            </ul>
            <p className="text-amber-800">
              <span className="font-medium">Tip:</span> 5–10 representative rows are enough — you can truncate the rest.
              Dates, merchant names, and amounts can stay; they help the AI understand the format.
            </p>
          </div>
        </div>
      </Modal>
    );
  }

  if (stage === 'key') {
    return <APIKeyModal open onClose={onClose} onSaved={() => startAnalysis()} />;
  }

  const parsedCount = parseResult?.rows?.length || 0;
  const warnCount = parseResult?.errors?.length || 0;
  const canSave = !!spec && !!meta.name && !!meta.institution && parsedCount > 0;

  return (
    <Modal
      open={open}
      onClose={onClose}
      title="Set up a converter with AI"
      size="xl"
      footer={
        <>
          <div className="mr-auto text-xs text-slate-500 self-center">
            Using {LLM_PROVIDERS[cfg.provider]?.label} · <span className="font-mono">{cfg.model}</span> ·{' '}
            <button className="text-brand-600 hover:underline" onClick={() => setStage('key')}>change key</button>
          </div>
          <Button variant="ghost" onClick={onClose}>Cancel</Button>
          <Button onClick={doSave} disabled={!canSave}>Save converter &amp; parse</Button>
        </>
      }
    >
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        {/* Chat panel */}
        <div className="flex flex-col border border-slate-200 rounded-lg overflow-hidden h-[58vh]">
          <div ref={scrollRef} className="flex-1 overflow-auto scrollbar-thin p-3 space-y-3 bg-slate-50">
            {messages.map((m, i) => {
              if (m.role === 'auto' || m.role === 'note') {
                return <div key={i} className="text-center"><span className="inline-block text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded-full px-3 py-1">{m.display || m.text}</span></div>;
              }
              const isUser = m.role === 'user';
              return (
                <div key={i} className={classNames('flex', isUser ? 'justify-end' : 'justify-start')}>
                  <div className={classNames('max-w-[85%] rounded-lg px-3 py-2 text-sm whitespace-pre-wrap', isUser ? 'bg-brand-600 text-white' : 'bg-white border border-slate-200 text-slate-800')}>
                    {m.display || m.text}
                  </div>
                </div>
              );
            })}
            {busy && <div className="text-xs text-slate-500 px-1">Thinking…</div>}
            {fatal && <div className="text-xs text-red-600 bg-red-50 border border-red-200 rounded p-2">{fatal}</div>}
          </div>
          <div className="border-t border-slate-200 p-2 flex gap-2 bg-white">
            <Input
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
              placeholder="e.g. the dates are off by a month, or amounts should be flipped"
              disabled={busy}
            />
            <Button onClick={send} disabled={busy || !input.trim()}>Send</Button>
          </div>
        </div>

        {/* Preview / save panel */}
        <div className="space-y-3">
          <ConverterMetaForm meta={meta} setMeta={setMeta} />
          <div className="flex items-center gap-2 text-xs">
            {parseResult ? (
              parseResult.error
                ? <Badge color="red">Engine error</Badge>
                : <>
                    <Badge color={parsedCount > 0 ? 'green' : 'slate'}>{parsedCount} parsed</Badge>
                    <Badge color={warnCount > 0 ? 'amber' : 'slate'}>{warnCount} warning(s)</Badge>
                  </>
            ) : <span className="text-slate-400">Waiting for first result…</span>}
          </div>
          {spec
            ? <LivePreview file={file} spec={spec} format={format} />
            : <div className="text-sm text-slate-500">The proposed converter and a live transaction preview will appear here.</div>}
        </div>
      </div>
    </Modal>
  );
}

/* === MODULE 12: REVIEW ==================================================
   Components:
     ReviewView (top-level)
       ReviewSummary (counts + actions)
       ReviewTable (editable list)
         ReviewRow (single editable transaction)
   ========================================================================== */

function ReviewView() {
  const { state, dispatch } = useApp();
  const review = state.pendingReview;
  const [items, setItems] = useState([]);
  const [filter, setFilter] = useState('all'); // all | duplicates | excluded | issues
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (review) {
      setItems(review.transactions.map((t, i) => ({ ...t, _id: i, _confirmed: !t._duplicate })));
    }
  }, [review]);

  if (!review) {
    return (
      <PageContainer>
        <EmptyState
          icon="📋"
          title="Nothing to review"
          description="Upload a document and pick a converter to see transactions here."
          action={<Button onClick={() => dispatch({ type: 'SET_VIEW', view: 'upload' })}>Go to Upload</Button>}
        />
      </PageContainer>
    );
  }

  const updateItem = (idx, patch) => setItems(items => items.map((t,i) => i === idx ? { ...t, ...patch } : t));
  const removeItem = idx => setItems(items => items.filter((_,i) => i !== idx));

  const filteredIdx = items
    .map((t,i) => ({ t, i }))
    .filter(({t}) => {
      if (filter === 'duplicates') return t._duplicate;
      if (filter === 'excluded') return t.is_excluded;
      if (filter === 'issues') return t._duplicate || !t.transaction_date || !t.amount;
      return true;
    });

  const counts = {
    total: items.length,
    duplicates: items.filter(t => t._duplicate).length,
    excluded: items.filter(t => t.is_excluded).length,
    toImport: items.filter(t => t._confirmed && !t.is_excluded && !t._duplicate).length
  };

  // After importing or discarding the current review, advance to the next file
  // in the batch (if any), or finish the batch and navigate away.
  const advanceOrFinish = (toast) => {
    if (state.batchQueue.length > 0) {
      const next = state.batchQueue[0];
      dispatch({ type: 'BATCH_ADVANCE' });
      dispatch({ type: 'SET_REVIEW', payload: next.parsedReview });
      if (toast) dispatch({ type: 'TOAST', toast });
      return;
    }
    dispatch({ type: 'CLEAR_REVIEW' });
    if (state.batchStats) {
      // Last file of a batch — show the rolled-up summary instead of the per-file toast.
      dispatch({ type: 'TOAST', toast: { kind: 'success', message: formatBatchSummary(state.batchStats) } });
      dispatch({ type: 'SET_VIEW', view: 'upload' });
    } else {
      if (toast) dispatch({ type: 'TOAST', toast });
      dispatch({ type: 'SET_VIEW', view: 'transactions' });
    }
  };

  const importAll = async () => {
    setBusy(true);
    try {
      const toInsert = items
        .filter(t => t._confirmed && !t._duplicate)
        .map(t => ({
          document_id: review.document_id,
          account_id: review.account_id,
          transaction_date: t.transaction_date,
          posted_date: t.posted_date,
          description: t.description,
          merchant: t.merchant,
          amount: t.amount,
          currency: t.currency,
          category: t.category,
          transaction_type: t.transaction_type,
          is_excluded: t.is_excluded ? 1 : 0,
          fingerprint: t.fingerprint
        }));
      const { inserted, skipped } = dao.bulkInsertTransactions(toInsert);
      dao.updateDocumentStatus(review.document_id, 'imported');
      dispatch({ type: 'REFRESH' });
      advanceOrFinish({ kind: 'success', message: `Imported ${inserted} transactions${skipped ? ` (${skipped} skipped)` : ''}` });
    } catch (e) {
      console.error(e);
      dispatch({ type: 'TOAST', toast: { kind: 'error', message: 'Import failed: ' + e.message } });
    } finally {
      setBusy(false);
    }
  };

  const onDiscard = () => {
    if (state.batchStats) {
      advanceOrFinish({ kind: 'info', message: `Skipped ${review.account_name || 'file'}` });
    } else {
      dispatch({ type: 'CLEAR_REVIEW' });
    }
  };

  const batchPosition = state.batchStats?.queuedForReview > 0
    ? { current: state.batchStats.queuedForReview - state.batchQueue.length, total: state.batchStats.queuedForReview }
    : null;

  return (
    <PageContainer>
      {batchPosition && (
        <div className="mb-4 px-4 py-2 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-900 flex items-center justify-between">
          <span>Batch review — file <span className="font-semibold">{batchPosition.current}</span> of {batchPosition.total}</span>
          <span className="text-xs text-emerald-700">
            {state.batchStats.autoImported > 0 && `${state.batchStats.autoImported} auto-imported`}
            {state.batchStats.autoImported > 0 && state.batchStats.skippedNoHint > 0 && ' · '}
            {state.batchStats.skippedNoHint > 0 && `${state.batchStats.skippedNoHint} unrecognized`}
          </span>
        </div>
      )}
      <PageHeader
        title="Review extracted transactions"
        description={`${review.account_name} · parsed from ${review.transactions.length} rows`}
        action={
          <div className="flex items-center gap-2">
            <Button variant="ghost" onClick={onDiscard}>{state.batchStats ? 'Skip file' : 'Discard'}</Button>
            <Button variant="success" onClick={importAll} disabled={busy || counts.toImport === 0}>
              Import {counts.toImport} {counts.toImport === 1 ? 'transaction' : 'transactions'}
            </Button>
          </div>
        }
      />

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <StatTile label="Total parsed" value={counts.total} />
        <StatTile label="Duplicates" value={counts.duplicates} color={counts.duplicates ? 'amber' : 'slate'} />
        <StatTile label="Excluded" value={counts.excluded} />
        <StatTile label="Will import" value={counts.toImport} color="green" />
      </div>

      <Card>
        <CardHeader
          title="Transactions"
          right={
            <Select value={filter} onChange={e => setFilter(e.target.value)} className="w-40">
              <option value="all">All</option>
              <option value="duplicates">Duplicates</option>
              <option value="excluded">Excluded</option>
              <option value="issues">Issues only</option>
            </Select>
          }
        />
        <ReviewTable items={filteredIdx} updateItem={updateItem} removeItem={removeItem} />
      </Card>

      {review.errors?.length > 0 && (
        <details className="mt-6">
          <summary className="text-sm text-amber-700 hover:underline cursor-pointer">{review.errors.length} parse warnings</summary>
          <pre className="mt-2 text-xs bg-amber-50 border border-amber-200 rounded p-3 max-h-48 overflow-auto scrollbar-thin font-mono whitespace-pre-wrap">
            {review.errors.map(e => e.row ? `Row ${e.row}: ${e.error}` : e.error).join('\n')}
          </pre>
        </details>
      )}
    </PageContainer>
  );
}

function buildPageNumbers(current, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const pages = new Set([1, total, current]);
  for (let i = Math.max(2, current - 2); i <= Math.min(total - 1, current + 2); i++) pages.add(i);
  const sorted = [...pages].sort((a, b) => a - b);
  const result = [];
  for (let i = 0; i < sorted.length; i++) {
    if (i > 0 && sorted[i] - sorted[i - 1] > 1) result.push('...');
    result.push(sorted[i]);
  }
  return result;
}

function TxnPaginator({ page, totalPages, total, pageSize, setPage, setPageSize }) {
  const start = total === 0 ? 0 : (page - 1) * pageSize + 1;
  const end = Math.min(page * pageSize, total);
  const pageNums = buildPageNumbers(page, totalPages);
  const btnBase = 'min-w-[2rem] px-2 py-1 rounded text-center transition-colors';
  return (
    <div className="flex items-center justify-between px-4 py-2 text-sm text-slate-600">
      <span className="text-slate-500 whitespace-nowrap">{start}–{end} of {total}</span>
      <div className="flex items-center gap-1">
        <button onClick={() => setPage(p => p - 1)} disabled={page === 1}
          className="px-2 py-1 rounded hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">‹</button>
        {pageNums.map((n, i) =>
          n === '...'
            ? <span key={`e${i}`} className="px-1 text-slate-400 select-none">…</span>
            : <button key={n} onClick={() => setPage(n)}
                className={classNames(btnBase, n === page ? 'bg-emerald-600 text-white font-medium' : 'hover:bg-slate-100')}>
                {n}
              </button>
        )}
        <button onClick={() => setPage(p => p + 1)} disabled={page === totalPages}
          className="px-2 py-1 rounded hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">›</button>
      </div>
      <div className="flex items-center gap-2 whitespace-nowrap">
        <span className="text-slate-400">Per page</span>
        <select value={pageSize} onChange={e => { setPageSize(Number(e.target.value)); setPage(1); }}
          className="border border-slate-300 rounded px-2 py-1 text-sm bg-white">
          {[25, 50, 75, 100].map(n => <option key={n} value={n}>{n}</option>)}
        </select>
      </div>
    </div>
  );
}

function sortTransactions(rows, { col, dir }) {
  const m = dir === 'desc' ? -1 : 1;
  return [...rows].sort((a, b) => {
    let cmp;
    switch (col) {
      case 'transaction_date': cmp = (a.transaction_date || '').localeCompare(b.transaction_date || '') || (a.id - b.id); break;
      case 'description':      cmp = (a.description || '').localeCompare(b.description || ''); break;
      case 'account':          cmp = (a.institution || '').localeCompare(b.institution || '') || (a.account_name || '').localeCompare(b.account_name || ''); break;
      case 'category':         cmp = (a.category || '').localeCompare(b.category || ''); break;
      case 'transaction_type': cmp = (a.transaction_type || '').localeCompare(b.transaction_type || ''); break;
      case 'signed_amount':    cmp = (a.signed_amount || 0) - (b.signed_amount || 0); break;
      default:                 cmp = 0;
    }
    return m * cmp;
  });
}

function SortTh({ col, label, sort, setSort, align = 'left', className = '' }) {
  const active = sort.col === col;
  const toggle = () => setSort(s =>
    s.col === col ? { col, dir: s.dir === 'desc' ? 'asc' : 'desc' } : { col, dir: 'desc' }
  );
  return (
    <th className={`px-3 py-2 cursor-pointer select-none hover:bg-slate-100 text-${align} ${className}`} onClick={toggle}>
      <span className="inline-flex items-center gap-1">
        {label}
        <span className={active ? 'text-emerald-600' : 'text-slate-300'}>
          {active ? (sort.dir === 'desc' ? '↓' : '↑') : '↕'}
        </span>
      </span>
    </th>
  );
}

}

function exportCsv(rows) {
  const cols = ['transaction_date','posted_date','description','merchant','amount','currency','category','transaction_type','institution','account_name','is_excluded'];
  const csv = [
    cols.join(','),
    ...rows.map(r => cols.map(c => {
      const v = r[c];
      if (v === null || v === undefined) return '';
      const s = String(v).replace(/"/g, '""');
      return /[",\n]/.test(s) ? `"${s}"` : s;
    }).join(','))
  ].join('\n');
  downloadBlob(csv, 'transactions.csv', 'text/csv');
}

function CreateRuleModal({ transaction, onClose }) {
  const { dispatch } = useApp();
  const [pattern, setPattern] = useState('');
  const [matchType, setMatchType] = useState('contains');
  const [category, setCategory] = useState('');
  const [priority, setPriority] = useState(100);

  useEffect(() => {
    if (transaction) {
      setPattern(transaction.description || '');
      setMatchType('contains');
      setCategory(transaction.category || 'Other');
      setPriority(100);
    }
  }, [transaction]);

  if (!transaction) return null;

  const save = () => {
    if (!pattern.trim() || !category) return;
    dao.saveCategoryRule({ pattern: pattern.trim(), match_type: matchType, category, priority: Number(priority) });
    dispatch({ type: 'TOAST', toast: { kind: 'success', message: `Rule saved: "${pattern.trim()}" → ${category}` } });
    dispatch({ type: 'REFRESH' });
    onClose();
  };

  return (
    <Modal open={!!transaction} onClose={onClose} title="Create category rule"
      footer={<><Button variant="ghost" onClick={onClose}>Cancel</Button><Button onClick={save}>Save rule</Button></>}>
      <div className="space-y-4 text-sm">
        <p className="text-slate-500">Future transactions matching this pattern will be auto-categorized.</p>
        <div>
          <Label>Pattern</Label>
          <Input value={pattern} onChange={e => setPattern(e.target.value)} className="font-mono" />
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <Label>Match type</Label>
            <Select value={matchType} onChange={e => setMatchType(e.target.value)}>
              <option value="contains">Contains</option>
              <option value="startswith">Starts with</option>
              <option value="regex">Regex</option>
            </Select>
          </div>
          <div>
            <Label>Priority (higher runs first)</Label>
            <Input type="number" value={priority} onChange={e => setPriority(e.target.value)} min="1" max="999" />
          </div>
        </div>
        <div>
          <Label>Category</Label>
          <Select value={category} onChange={e => setCategory(e.target.value)}>
            <option value="">— select —</option>

}

const AI_AVAILABLE_CATS = CATEGORIES.filter(c =>
  !['Transfer','Credit Card Payment','Refund','Income','Other'].includes(c));

function buildAIPrompt(entries) {
  return `Categorize these Canadian personal finance transaction descriptions.
Choose the best category from: ${AI_AVAILABLE_CATS.join(', ')}.
Return ONLY valid JSON, no explanation: {"results":[{"i":0,"cat":"Dining"},{"i":1,"cat":"Groceries"},...]}

Transactions:
${entries.map((e, i) => `${i}: ${e.description}`).join('\n')}`;
}

function parseAIResponse(text, entries) {
  let parsed = {};
  try { parsed = JSON.parse(text.match(/\{[\s\S]*\}/)?.[0] || '{}'); } catch {}
  const suggestions = [];
  for (const r of (parsed.results || [])) {
    const entry = entries[r.i];
    if (entry && AI_AVAILABLE_CATS.includes(r.cat)) {
      suggestions.push({ description: entry.description, category: r.cat, ids: entry.ids });
    }
  }
  return suggestions;
}

const AI_CAT_STORAGE_KEY = 'finance_ai_key_v1';

function AICategorizeModal({ open, onClose }) {
  const { state, dispatch } = useApp();
  const [apiKey, setApiKey] = useState(() => localStorage.getItem(AI_CAT_STORAGE_KEY) || '');
  const [keyDraft, setKeyDraft] = useState('');
  const [step, setStep] = useState('idle'); // idle | running | paste | review | error
  const [statusMsg, setStatusMsg] = useState('');
  const [copied, setCopied] = useState(false);
  const [responseDraft, setResponseDraft] = useState('');
  const [parseError, setParseError] = useState('');
  const [suggestions, setSuggestions] = useState([]);
  const [accepted, setAccepted] = useState({});
  const [createRules, setCreateRules] = useState(true);

  const { entries, prompt } = useMemo(() => {
    if (!open) return { entries: [], prompt: '' };
    const groups = {};
    for (const t of dao.listTransactions({}).filter(t => !t.category || t.category === 'Other')) {
      const key = (t.description || '').toLowerCase().trim();
      if (!groups[key]) groups[key] = { description: t.description, ids: [] };
      groups[key].ids.push(t.id);
    }
    const entries = Object.values(groups);
    return { entries, prompt: buildAIPrompt(entries) };
  }, [open, state.refreshKey]);

  const reset = () => { setStep('idle'); setStatusMsg(''); setCopied(false); setResponseDraft(''); setParseError(''); setSuggestions([]); setAccepted({}); };
  const handleClose = () => { reset(); onClose(); };

  const saveKey = () => {
    const k = keyDraft.trim();
    if (!k) return;
    localStorage.setItem(AI_CAT_STORAGE_KEY, k);
    setApiKey(k);
    setKeyDraft('');
  };

  const runAPI = async () => {
    setStep('running');
    setSuggestions([]);
    setAccepted({});
    try {
      const BATCH = 150;
      const allSuggestions = [];
      for (let start = 0; start < entries.length; start += BATCH) {
        const batch = entries.slice(start, start + BATCH);
        setStatusMsg(`Categorizing ${Math.min(start + BATCH, entries.length)} of ${entries.length} descriptions…`);
        const batchPrompt = buildAIPrompt(batch);
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-allow-browser': 'true',
          },
          body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 2048,
            messages: [{ role: 'user', content: batchPrompt }]
          })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error?.message || `API error ${res.status}`);
        }
        const data = await res.json();
        allSuggestions.push(...parseAIResponse(data.content?.[0]?.text || '', batch));
      }
      setSuggestions(allSuggestions);
      setAccepted(Object.fromEntries(allSuggestions.map((_, i) => [i, true])));
      setStep('review');
    } catch (e) {
      setStatusMsg(e.message || 'Unknown error');
      setStep('error');
    }
  };

  const copyPrompt = () => {
    navigator.clipboard.writeText(prompt).then(() => { setCopied(true); setStep('paste'); });
  };

  const parseResponse = () => {
    setParseError('');
    const s = parseAIResponse(responseDraft, entries);
    if (s.length === 0) { setParseError('No valid suggestions found — make sure you pasted the full JSON response.'); return; }
    setSuggestions(s);
    setAccepted(Object.fromEntries(s.map((_, i) => [i, true])));
    setStep('review');
  };

  const apply = () => {
    const toApply = suggestions.filter((_, i) => accepted[i]);
    for (const s of toApply) {
      for (const id of s.ids) dao.updateTransaction(id, { category: s.category });
      if (createRules) dao.saveCategoryRule({ pattern: s.description, match_type: 'contains', category: s.category, priority: 50 });
    }
    dispatch({ type: 'REFRESH' });
    dispatch({ type: 'TOAST', toast: { kind: 'success', message: `Applied ${toApply.length} suggestion${toApply.length !== 1 ? 's' : ''}${createRules ? ' + saved rules' : ''}` } });
    handleClose();
  };

  const acceptedCount = Object.values(accepted).filter(Boolean).length;

  const footer = step === 'review' ? (
    <>
      <label className="flex items-center gap-2 text-sm mr-auto">
        <input type="checkbox" checked={createRules} onChange={e => setCreateRules(e.target.checked)} />
        Also create rules for accepted suggestions
      </label>
      <Button variant="ghost" onClick={handleClose}>Cancel</Button>
      <Button onClick={apply} disabled={acceptedCount === 0}>Apply {acceptedCount} suggestion{acceptedCount !== 1 ? 's' : ''}</Button>
    </>
  ) : (
    <Button variant="ghost" onClick={handleClose}>Close</Button>
  );

  return (
    <Modal open={open} onClose={handleClose} title="AI category suggestions" size="lg" footer={footer}>
      <div className="space-y-4 text-sm">
        {(step === 'idle' || step === 'error') && (
          <div className="space-y-4">
            <p><strong>{entries.length}</strong> unique description{entries.length !== 1 ? 's' : ''} to categorize.</p>

            {step === 'error' && (
              <div className="p-3 bg-red-50 border border-red-200 rounded text-red-700 text-xs">{statusMsg}</div>
            )}

            <div className="border border-slate-200 rounded-lg p-4 space-y-3">
              <div className="font-medium">Option 1 — Anthropic API key</div>
              <p className="text-slate-500 text-xs">Runs automatically. Get a key at console.anthropic.com.</p>
              {apiKey ? (
                <div className="flex gap-2 items-center">
                  <Button onClick={runAPI}>Run AI categorization</Button>
                  <button className="text-xs text-slate-400 hover:text-slate-600" onClick={() => { localStorage.removeItem(AI_CAT_STORAGE_KEY); setApiKey(''); }}>Clear key</button>
                </div>
              ) : (
                <div className="flex gap-2">
                  <Input type="password" placeholder="sk-ant-..." value={keyDraft} onChange={e => setKeyDraft(e.target.value)} onKeyDown={e => e.key === 'Enter' && saveKey()} className="flex-1 font-mono text-xs" />
                  <Button onClick={saveKey} disabled={!keyDraft.trim()}>Save &amp; run</Button>
                </div>
              )}
            </div>

            <div className="border border-slate-200 rounded-lg p-4 space-y-3">
              <div className="font-medium">Option 2 — Clipboard (no API key)</div>
              <p className="text-slate-500 text-xs">Copy the prompt, paste into Claude.ai, paste the JSON response back.</p>
              <Button variant="secondary" onClick={copyPrompt}>{copied ? 'Copied!' : 'Copy prompt'}</Button>
            </div>
          </div>
        )}

        {step === 'running' && (
          <div className="py-8 text-center text-slate-500">
            <div className="text-base mb-2">Running…</div>
            <div className="text-xs">{statusMsg}</div>
          </div>
        )}

        {step === 'paste' && (
          <div className="space-y-3">
            <p className="text-slate-600">Paste the AI's JSON response here:</p>
            <textarea
              value={responseDraft}
              onChange={e => { setResponseDraft(e.target.value); setParseError(''); }}
              rows={10}
              placeholder={'{"results":[{"i":0,"cat":"Dining"},{"i":1,"cat":"Groceries"},...]}'}
              className="w-full font-mono text-xs border border-slate-200 rounded p-3 resize-none focus:outline-none focus:ring-2 focus:ring-emerald-500"
              autoFocus
            />
            {parseError && <p className="text-red-600 text-xs">{parseError}</p>}
            <div className="flex gap-2">
              <Button onClick={parseResponse} disabled={!responseDraft.trim()}>Parse suggestions</Button>
              <Button variant="ghost" onClick={() => setStep('idle')}>Back</Button>
            </div>
          </div>
        )}

        {step === 'review' && (
          <div className="space-y-3">
            <p>{suggestions.length} suggestion{suggestions.length !== 1 ? 's' : ''} — uncheck any you want to skip.</p>
            <div className="flex gap-2 text-xs">
              <button className="text-emerald-600 hover:underline" onClick={() => setAccepted(Object.fromEntries(suggestions.map((_,i)=>[i,true])))}>Select all</button>
              <span className="text-slate-300">|</span>
              <button className="text-slate-500 hover:underline" onClick={() => setAccepted({})}>Deselect all</button>
            </div>
            <div className="max-h-96 overflow-auto border border-slate-200 rounded">
              <table className="w-full text-xs">
                <thead className="bg-slate-50 text-slate-500 uppercase tracking-wide sticky top-0">
                  <tr>
                    <th className="px-3 py-2 w-8"></th>
                    <th className="text-left px-3 py-2">Description</th>
                    <th className="text-left px-3 py-2">Suggested category</th>
                    <th className="text-right px-3 py-2">Txns</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {suggestions.map((s, i) => (
                    <tr key={i} className={accepted[i] ? '' : 'opacity-40'}>
                      <td className="px-3 py-1.5 text-center">
                        <input type="checkbox" checked={!!accepted[i]} onChange={e => setAccepted(a => ({...a, [i]: e.target.checked}))} />
                      </td>
                      <td className="px-3 py-1.5 font-mono max-w-xs truncate" title={s.description}>{s.description}</td>
                      <td className="px-3 py-1.5">
                        <Select value={s.category} onChange={e => setSuggestions(prev => prev.map((x,j) => j===i ? {...x, category: e.target.value} : x))} className="text-xs py-0.5 px-1">
                          {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                        </Select>
                      </td>
                      <td className="px-3 py-1.5 text-right text-slate-500">{s.ids.length}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>
    </Modal>
  );
}

const REPORT_PREFS_KEY = 'report_prefs_v1';
function loadReportPrefs() {
  try { return JSON.parse(localStorage.getItem(REPORT_PREFS_KEY)) || null; } catch { return null; }
}
function saveReportPrefs(prefs) {
  try { localStorage.setItem(REPORT_PREFS_KEY, JSON.stringify(prefs)); } catch {}
}

function detectRecurring(transactions) {
  const candidates = transactions.filter(t =>
    t.transaction_type === 'expense' && !t.is_excluded);

  const groups = {};
  candidates.forEach(t => {
    const key = ((t.merchant || t.description || '').slice(0, 40)).trim().toUpperCase();
    if (!key) return;
    (groups[key] = groups[key] || []).push(t);
  });

  const recurring = [];
  const recurringTxnIds = new Set();

  for (const [key, txns] of Object.entries(groups)) {
    if (txns.length < 3) continue;
    const sorted = txns.slice().sort((a, b) =>
      (a.transaction_date || '').localeCompare(b.transaction_date || ''));

    const amounts = sorted.map(t => Math.abs(t.amount));
    const sortedAmounts = amounts.slice().sort((a, b) => a - b);
    const median = sortedAmounts[Math.floor(sortedAmounts.length / 2)];
    const band = Math.max(2, median * 0.10);
    const tier = sorted.filter(t => Math.abs(Math.abs(t.amount) - median) <= band);
    if (tier.length < 3) continue;
    // Reject noisy merchants: the stable-price tier must dominate the merchant's visits.
    // A real subscription has most charges near the same amount; a grocery store has a
    // wide spread and only a few visits will randomly land near the median.
    if (tier.length / sorted.length < 0.7) continue;

    const gaps = [];
    for (let i = 1; i < tier.length; i++) {
      const d1 = new Date(tier[i-1].transaction_date);
      const d2 = new Date(tier[i].transaction_date);
      const days = Math.round((d2 - d1) / 86400000);
      if (Number.isFinite(days) && days > 0) gaps.push(days);
    }
    if (gaps.length === 0) continue;
    const sortedGaps = gaps.slice().sort((a, b) => a - b);
    const medianGap = sortedGaps[Math.floor(sortedGaps.length / 2)];
    if (medianGap < 25 || medianGap > 35) continue;
    // Require that most gaps (not just the median) are in the monthly window.
    // Prevents false positives where two outlier pairs happen to be ~30 days apart.
    const monthlyGaps = gaps.filter(g => g >= 25 && g <= 35).length;
    if (monthlyGaps / gaps.length < 0.7) continue;

    recurring.push({
      key,
      name: tier[0].merchant || (tier[0].description || '').slice(0, 40),
      typical_amount: median,
      cadence_days: medianGap,
      last_seen: tier[tier.length - 1].transaction_date,
      occurrences: tier.length,
      monthly_estimate: median,
    });
    tier.forEach(t => recurringTxnIds.add(t.id));
  }

  recurring.sort((a, b) => b.monthly_estimate - a.monthly_estimate);
  return { recurring, recurringTxnIds };
}

function ReportsView() {
  const { state } = useApp();
  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);
  const thisYearFrom = new Date(today.getFullYear(), 0, 1).toISOString().slice(0, 10);

  const _prefs = loadReportPrefs();
  const [from, setFrom] = useState(_prefs?.from ?? thisYearFrom);
  const [to, setTo] = useState(_prefs?.to ?? todayStr);
  const [excludeTransfers, setExcludeTransfers] = useState(_prefs?.excludeTransfers ?? true);
  const [excludePayments, setExcludePayments] = useState(_prefs?.excludePayments ?? true);
  const [accounts, setAccounts] = useState([]);
  const [accountFilter, setAccountFilter] = useState(_prefs?.accountFilter ?? '');

  useEffect(() => {
    const activeIds = new Set(STORE.transactions.map(t => t.account_id));
    setAccounts(dao.listAccounts().filter(a => activeIds.has(a.id)));
  }, []);
  useEffect(() => {
    saveReportPrefs({ from, to, excludeTransfers, excludePayments, accountFilter });
  }, [from, to, excludeTransfers, excludePayments, accountFilter]);

  const txns = useMemo(() => {
    const all = dao.listTransactions({
      from, to,
      account_id: accountFilter || null
    });
    return all.filter(t => !t.is_excluded
      && (!excludeTransfers || t.transaction_type !== 'transfer')
      && (!excludePayments || t.transaction_type !== 'cc_payment'));
  }, [from, to, excludeTransfers, excludePayments, accountFilter, state.refreshKey]);

  // When the user keeps a category in the dataset (excludeTransfers/excludePayments
  // off), surface those rows in the expense/income series too — otherwise Top
  // Merchants, By Category, and the monthly chart silently drop them and the
  // SummaryStrip undercounts. Direction is taken from signed_amount: outgoing →
  // expense, incoming → income. The toggle in ReportControls is the gate for
  // potential double-counting across linked accounts.
  const isSpend = t => t.transaction_type === 'expense'
    || (t.signed_amount < 0 && (t.transaction_type === 'transfer' || t.transaction_type === 'cc_payment'));
  const isInflow = t => t.transaction_type === 'income'
    || (t.signed_amount > 0 && (t.transaction_type === 'transfer' || t.transaction_type === 'cc_payment'));
  const expenses = txns.filter(isSpend);
  const income = txns.filter(isInflow);

  const totalExpense = expenses.reduce((a,t) => a + t.amount, 0);
  const totalIncome = income.reduce((a,t) => a + t.amount, 0);

  return (
    <PageContainer>
      <PageHeader
        title="Reports"
        description="Monthly spend, category breakdown, top merchants, and month-over-month deltas."
      />

      <ReportControls
        from={from} setFrom={setFrom}
        to={to} setTo={setTo}
        excludeTransfers={excludeTransfers} setExcludeTransfers={setExcludeTransfers}
        excludePayments={excludePayments} setExcludePayments={setExcludePayments}
        accounts={accounts}
        accountFilter={accountFilter} setAccountFilter={setAccountFilter}
      />

      <SummaryStrip
        totalExpense={totalExpense}
        totalIncome={totalIncome}
        net={totalIncome - totalExpense}
        count={txns.length}
        from={from}
        to={to}
      />

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
        <div className="lg:col-span-2">
          <Card>
            <CardHeader title="Monthly expenses" subtitle="Total expense per month over the selected range" />
            <div className="p-5"><MonthlyExpensesChart expenses={expenses} income={income} /></div>
          </Card>
        </div>
        <Card>
          <CardHeader title="By category" subtitle="Total expense per category" />
          <div className="p-5"><CategoryBreakdownChart expenses={expenses} /></div>
        </Card>
      </div>

      <div className="mt-6">
        <Card>
          <CardHeader title="Recurring charges" subtitle="Likely subscriptions and other monthly debits" />
          <RecurringChargesTable expenses={expenses} />
        </Card>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
        <Card>
          <CardHeader title="Top merchants" subtitle="Where the money went — click a row to expand" />
          <TopMerchantsTable expenses={expenses} />
        </Card>
        <Card>
          <CardHeader title="Month-over-month" subtitle="Percentage change vs. previous month" />
          <MonthOverMonthTable expenses={expenses} />
        </Card>
      </div>
    </PageContainer>
  );
}

  const presets = useMemo(() => {

        { label: '3 months',    from: new Date(y, m - 2, 1).toISOString().slice(0, 10), to: s },

      ],
